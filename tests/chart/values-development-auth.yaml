# The chart has no default authentication. Tests that do not choose it
# themselves render with development accounts, on purpose, from this
# file; a test's own values files come after it and override it.
auth:
  type: DEVELOPMENT_BECOME_ANY_ACCOUNT
  allowDevelopmentAccounts: true
