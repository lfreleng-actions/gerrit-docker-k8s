# Rendered by the chart; site-init installs it at every start
log4j.rootLogger=INFO, stderr
log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=com.google.gerrit.pgm.util.ErrorLogJsonLayout

log4j.logger.httpd_log=INFO, httpd_log
log4j.additivity.httpd_log=false
log4j.appender.httpd_log=org.apache.log4j.DailyRollingFileAppender
log4j.appender.httpd_log.DatePattern='.'yyyy-MM-dd
log4j.appender.httpd_log.File=/var/gerrit/logs/httpd_log
log4j.appender.httpd_log.Encoding=UTF-8
log4j.appender.httpd_log.layout=com.google.gerrit.pgm.http.jetty.HttpLogLayout

log4j.logger.sshd_log=INFO, sshd_log
log4j.additivity.sshd_log=false
log4j.appender.sshd_log=org.apache.log4j.DailyRollingFileAppender
log4j.appender.sshd_log.DatePattern='.'yyyy-MM-dd
log4j.appender.sshd_log.File=/var/gerrit/logs/sshd_log
log4j.appender.sshd_log.Encoding=UTF-8
log4j.appender.sshd_log.layout=com.google.gerrit.sshd.SshLogLayout
