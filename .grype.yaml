# Grype configuration for the release image's vulnerability gate
# (release.yaml's grype job and testing.yaml's release-build job).
#
# Each rule accepts one finding in a component this repository does
# not build. A rule names the vulnerability and the package's exact
# name, version and type, so it stops matching once a base image or
# plugin bump changes that version, and the finding gates again until
# someone reviews it. Never match by package name alone, by wildcard
# or by fix state, and never accept an Ubuntu package: the Dockerfile
# upgrades those at build time. The README's "Vulnerability gate"
# section describes the policy.

ignore:

