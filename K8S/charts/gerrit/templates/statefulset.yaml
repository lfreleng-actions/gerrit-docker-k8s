{{- $fullname := include "gerrit.fullname" . }}
{{- $versionPath := printf "%s/config/server/version" (include "gerrit.urlPrefix" .) }}
{{- $readinessPath := include "gerrit.readinessProbePath" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  replicas: 1
  podManagementPolicy: OrderedReady
  serviceName: {{ $fullname }}-headless
  selector:
    matchLabels:
      {{- include "gerrit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gerrit.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- include "gerrit.otelOptOutAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "gerrit.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "gerrit.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- if .Values.persistence.volumePermissions.enabled }}
        # Runs as root: provisioners such as kind's local-path ignore
        # fsGroup, so the site volume needs an explicit chown.
        - name: volume-permissions
          image: {{ include "gerrit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              find /mnt/site \( ! -user {{ include "gerrit.uid" . }} -o ! -group {{ include "gerrit.uid" . }} \)
              -exec chown -h {{ include "gerrit.uid" . }}:{{ include "gerrit.uid" . }} {} +
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: site
              mountPath: /mnt/site
        {{- end }}
        {{- $importSource := include "gerrit.siteImportSource" . }}
        - name: site-import
          image: {{ include "gerrit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/scripts/site-import.py"]
          env:
            {{- include "gerrit.sitePrepareEnv" . | nindent 12 }}
            - name: HOME
              value: /tmp
            - name: SITE_INIT_SCRIPT
              value: /scripts/site-init.sh
            - name: SITE_IMPORT_SCRATCH
              value: /scratch
            - name: SITE_IMPORT_MODE
              value: {{ .Values.siteImport.mode | quote }}
            - name: SITE_IMPORT_FORCE_TOKEN
              value: {{ .Values.siteImport.forceToken | toString | quote }}
            - name: SITE_IMPORT_SOURCE_TYPE
              value: {{ $importSource | quote }}
            - name: SITE_IMPORT_SOURCE_URL
              value: {{ .Values.siteImport.source.url | quote }}
            {{- if and (eq $importSource "https") .Values.siteImport.source.existingSecret }}
            - name: SITE_IMPORT_URLS
              value: /import-urls
            {{- end }}
            - name: SITE_IMPORT_EXPECTED_MANIFEST_SHA256
              value: {{ .Values.siteImport.source.expectedManifestSha256 | quote }}
            - name: SITE_IMPORT_REINDEX
              value: {{ .Values.siteImport.reindex | toString | quote }}
            - name: SITE_IMPORT_VERIFY
              value: {{ .Values.siteImport.verify | toString | quote }}
            - name: SITE_IMPORT_SECURE_KEYS
              value: {{ include "gerrit.secureConfigKeys" . | quote }}
            - name: SITE_IMPORT_JAVA_HEAP
              value: {{ include "gerrit.siteImportHeap" . | quote }}
            - name: SITE_IMPORT_CPU_LIMIT
              value: {{ dig "limits" "cpu" "" (include "gerrit.siteImportResources" . | fromYaml) | toString | quote }}
            {{- if include "gerrit.samlEnabled" . }}
            - name: SITE_IMPORT_SAML_KEYSTORE
              value: /saml/samlKeystore.jks
            {{- end }}
          securityContext:
            {{- include "gerrit.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- include "gerrit.siteImportResources" . | nindent 12 }}
          volumeMounts:
            - name: site
              mountPath: /mnt/site
            - name: config
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: import-scratch
              mountPath: /scratch
            {{- if eq $importSource "pvc" }}
            - name: import-source
              mountPath: /mnt/import
              readOnly: true
            {{- end }}
            {{- if and (eq $importSource "https") .Values.siteImport.source.existingSecret }}
            - name: import-urls
              mountPath: /import-urls
              readOnly: true
            {{- end }}
            {{- if include "gerrit.samlEnabled" . }}
            - name: saml
              mountPath: /saml/samlKeystore.jks
              subPath: samlKeystore.jks
              readOnly: true
            {{- end }}
        - name: site-init
          image: {{ include "gerrit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/site-init.sh"]
          env:
            {{- include "gerrit.sitePrepareEnv" . | nindent 12 }}
            - name: GERRIT_HOOKS_PATH
              value: {{ if include "gerrit.hooksEnabled" . }}{{ include "gerrit.hooksPath" . | quote }}{{ else }}""{{ end }}
            - name: GERRIT_G2P_HOOKS
              value: {{ include "gerrit.g2pHooks" . | quote }}
            {{- if include "gerrit.g2pEnabled" . }}
            - name: GERRIT_G2P_INI
              value: /g2p/gerrit_to_platform.ini
            {{- end }}
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "gerrit.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: site
              mountPath: /mnt/site
            - name: config
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if include "gerrit.hookScriptsVolume" . }}
            - name: hook-scripts
              mountPath: /hook-scripts
              readOnly: true
            {{- end }}
            {{- if include "gerrit.g2pEnabled" . }}
            - name: g2p
              mountPath: /g2p
              readOnly: true
            {{- end }}
        - name: render-config
          image: {{ include "gerrit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/render-config.sh"]
          env:
            - name: GERRIT_SITE
              value: /var/gerrit
            - name: HOME
              value: /tmp
            - name: GERRIT_REGISTER_EMAIL_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.secureConfigSecretName" . }}
                  key: registerEmailPrivateKey
            - name: GERRIT_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.secureConfigSecretName" . }}
                  key: smtpPass
                  optional: true
            {{- if include "gerrit.samlEnabled" . }}
            - name: GERRIT_SAML_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.samlSecretName" . }}
                  key: keystore-password
            - name: GERRIT_SAML_PRIVATE_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.samlSecretName" . }}
                  key: private-key-password
            {{- end }}
            {{- if include "gerrit.itsJiraEnabled" . }}
            - name: GERRIT_ITS_JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.itsJiraSecretName" . }}
                  key: username
            - name: GERRIT_ITS_JIRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.itsJiraSecretName" . }}
                  key: password
            {{- end }}
            {{- if include "gerrit.metricsEnabled" . }}
            - name: GERRIT_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "gerrit.metricsSecretName" . }}
                  key: token
            {{- end }}
          securityContext:
            {{- include "gerrit.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "gerrit.siteMounts" . | nindent 12 }}
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: gerrit
          image: {{ include "gerrit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/var/gerrit/bin/gerrit.sh", "run"]
          env:
            - name: HOME
              value: /tmp
            {{- if include "gerrit.g2pEnabled" . }}
            # gerrit-to-platform reads its configuration, which
            # site-init installs, from $XDG_CONFIG_HOME
            - name: XDG_CONFIG_HOME
              value: /var/gerrit/.config
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 29418
          # First boot runs init and index creation in site-init, but
          # the daemon still loads caches and indexes before serving.
          # The startup probe waits up to ten minutes for the version
          # endpoint. Readiness then calls the healthcheck plugin when it
          # is enabled, so a failing check takes the pod out of service;
          # liveness stays on the version endpoint, so a failing check
          # never restarts the JVM.
          startupProbe:
            httpGet:
              path: {{ $versionPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ $readinessPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $versionPath }}
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            {{- include "gerrit.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "gerrit.siteMounts" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.replication.enabled }}
            # The replication plugin's SSH identity and known hosts;
            # its queue in data/replication stays on the site volume
            - name: replication-ssh
              mountPath: /var/gerrit/.ssh
              readOnly: true
            {{- end }}
            {{- if include "gerrit.samlEnabled" . }}
            # The SAML keystore and, from the Secret, the identity
            # provider's metadata; the module writes its own service
            # provider metadata to data/saml on the site volume
            - name: saml
              mountPath: /var/gerrit/etc/samlKeystore.jks
              subPath: samlKeystore.jks
              readOnly: true
            {{- if .Values.auth.saml.metadataFromSecret }}
            - name: saml
              mountPath: /var/gerrit/etc/saml-idp-metadata.xml
              subPath: idp-metadata.xml
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: scripts
          configMap:
            name: {{ $fullname }}-scripts
        - name: tmp
          emptyDir: {}
        - name: import-scratch
          {{- with .Values.siteImport.scratchSizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq $importSource "pvc" }}
        - name: import-source
          {{- toYaml .Values.siteImport.source.volume | nindent 10 }}
        {{- end }}
        {{- if and (eq $importSource "https") .Values.siteImport.source.existingSecret }}
        - name: import-urls
          secret:
            secretName: {{ .Values.siteImport.source.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.replication.enabled }}
        - name: replication-ssh
          projected:
            defaultMode: 0400
            sources:
              {{- with .Values.replication.sshKeySecret }}
              - secret:
                  name: {{ . }}
              {{- end }}
              - configMap:
                  name: {{ $fullname }}-known-hosts
                  items:
                    - key: known_hosts
                      path: known_hosts2
        {{- end }}
        {{- if include "gerrit.hookScriptsVolume" . }}
        - name: hook-scripts
          configMap:
            name: {{ $fullname }}-hooks
        {{- end }}
        {{- if include "gerrit.g2pEnabled" . }}
        - name: g2p
          secret:
            secretName: {{ include "gerrit.g2pSecretName" . }}
            defaultMode: 0400
        {{- end }}
        {{- if include "gerrit.samlEnabled" . }}
        - name: saml
          secret:
            secretName: {{ include "gerrit.samlSecretName" . }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: site
        labels:
          {{- include "gerrit.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
