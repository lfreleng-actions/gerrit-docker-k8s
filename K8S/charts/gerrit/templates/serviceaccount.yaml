{{- if .Values.serviceAccount.create }}
# The Gerrit pod's identity, for a workload identity such as IRSA; the
# pod mounts no API token, so the account needs no Kubernetes RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gerrit.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
