{{- $fullname := include "gerrit.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/scripts/*.sh").AsConfig | nindent 2 }}
  {{- (.Files.Glob "files/scripts/site?import*.py").AsConfig | nindent 2 }}
---
# etc/gerrit.config, jgit.config, notedb.config, log4j.properties and,
# with replication enabled, replication.config, with its-jira enabled,
# its/actions-its-jira.config, and with healthcheck enabled,
# healthcheck.config; site-init copies each over the site's own at
# every start
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
data:
  gerrit.config: |
    {{- tpl (.Files.Get "files/conf/gerrit.config.tpl") . | trim | nindent 4 }}
  {{- with include "gerrit.configFile" .Values.jgit | trim }}
  jgit.config: |
    {{- . | nindent 4 }}
  {{- else }}
  jgit.config: ""
  {{- end }}
  {{- with include "gerrit.configFile" .Values.notedb | trim }}
  notedb.config: |
    {{- . | nindent 4 }}
  {{- else }}
  notedb.config: ""
  {{- end }}
  log4j.properties: |
    {{- include "gerrit.log4jProperties" . | trim | nindent 4 }}
  {{- if .Values.replication.enabled }}
  replication.config: |
    {{- include "gerrit.replicationConfig" . | trim | nindent 4 }}
  {{- end }}
  {{- if include "gerrit.itsJiraEnabled" . }}
  {{- with include "gerrit.itsJiraActions" . | trim }}
  actions-its-jira.config: |
    {{- . | nindent 4 }}
  {{- else }}
  actions-its-jira.config: ""
  {{- end }}
  {{- end }}
  {{- if include "gerrit.healthcheckEnabled" . }}
  {{- with include "gerrit.configSection" (dict "name" "healthcheck" "values" .Values.plugins.healthcheck.config) | trim }}
  healthcheck.config: |
    {{- . | nindent 4 }}
  {{- else }}
  healthcheck.config: ""
  {{- end }}
  {{- end }}
{{- if .Values.replication.enabled }}
---
# Mounted in /var/gerrit/.ssh as known_hosts2, which the SSH client
# reads besides known_hosts, so the key Secret may carry its own
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-known-hosts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
data:
  known_hosts: |
    {{- include "gerrit.githubKnownHosts" . | nindent 4 }}
    {{- with .Values.replication.knownHosts | trim }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if include "gerrit.hooksEnabled" . }}
{{- with include "gerrit.hookScripts" . | fromJson }}
---
# hooks.scripts; site-init writes each to the hooks directory
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-hooks
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gerrit.labels" $ | nindent 4 }}
data:
  {{- range $name, $script := . }}
  {{ $name }}: {{ toString $script | quote }}
  {{- end }}
{{- end }}
{{- end }}
