{{- $fullname := include "gerrit.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/scripts/*.sh").AsConfig | nindent 2 }}
---
# etc/gerrit.config, jgit.config, notedb.config and, with replication
# enabled, replication.config; site-init copies each over the site's
# own at every start
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
data:
  gerrit.config: |
    {{- tpl (.Files.Get "files/conf/gerrit.config.tpl") . | trim | nindent 4 }}
  {{- with include "gerrit.configFile" .Values.jgit | trim }}
  jgit.config: |
    {{- . | nindent 4 }}
  {{- else }}
  jgit.config: ""
  {{- end }}
  {{- with include "gerrit.configFile" .Values.notedb | trim }}
  notedb.config: |
    {{- . | nindent 4 }}
  {{- else }}
  notedb.config: ""
  {{- end }}
  {{- if .Values.replication.enabled }}
  replication.config: |
    {{- include "gerrit.replicationConfig" . | trim | nindent 4 }}
  {{- end }}
{{- if .Values.replication.enabled }}
---
# Mounted in /var/gerrit/.ssh as known_hosts2, which the SSH client
# reads besides known_hosts, so the key Secret may carry its own
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-known-hosts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
data:
  known_hosts: |
    {{- include "gerrit.githubKnownHosts" . | nindent 4 }}
    {{- with .Values.replication.knownHosts | trim }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}
