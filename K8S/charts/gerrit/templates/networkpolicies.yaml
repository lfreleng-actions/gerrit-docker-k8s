{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "gerrit.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gerrit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gerrit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      {{- with .Values.networkPolicy.ingressNamespaceSelector }}
      from:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- if include "gerrit.metricsEnabled" $ }}
        {{- with $.Values.networkPolicy.metricsNamespaceSelector }}
        # The Prometheus that scrapes the metrics plugin
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - ports:
        - protocol: TCP
          port: 29418
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    {{- with .Values.sendemail }}
    {{- if and .smtpServer (ne (toString .enable) "false") }}
    {{- /* Gerrit's default port is 465 with SSL and 25 otherwise */}}
    {{- $default := ternary 465 25 (eq (lower (toString .smtpEncryption)) "ssl") }}
    - ports:
        - protocol: TCP
          port: {{ int (.smtpServerPort | default $default) }}
    {{- end }}
    {{- end }}
    {{- if .Values.replication.enabled }}
    {{- with include "gerrit.replicationEgressPorts" . | fromJsonArray }}
    - ports:
        {{- range . }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- with include "gerrit.samlEgressPort" . }}
    # The SAML identity provider's metadata URL
    - ports:
        - protocol: TCP
          port: {{ int . }}
    {{- end }}
    {{- with include "gerrit.siteImportEgressPorts" . | fromJsonArray }}
    # The https or s3 source site-import fetches the export from
    - ports:
        {{- range . }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    {{- end }}
    {{- with include "gerrit.itsJiraEgressPort" . }}
    # The Jira API of plugins.its-jira.url
    - ports:
        - protocol: TCP
          port: {{ int . }}
    {{- end }}
{{- end }}
