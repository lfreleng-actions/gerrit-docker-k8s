{{- $fullname := include "gerrit.fullname" . }}
{{- if not .Values.secrets.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  annotations:
    {{- include "gerrit.keepAnnotations" . | nindent 4 }}
type: Opaque
data:
  # Placeholder admin credential; later chart work bootstraps the account
  username: {{ "admin" | b64enc }}
  password: {{ include "gerrit.secretValue" (dict "ctx" . "name" (printf "%s-admin" $fullname) "key" "password") }}
{{- end }}
{{- if not .Values.secrets.secureConfig.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secure-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  annotations:
    {{- include "gerrit.keepAnnotations" . | nindent 4 }}
type: Opaque
data:
  registerEmailPrivateKey: {{ include "gerrit.secretValue" (dict "ctx" . "name" (printf "%s-secure-config" $fullname) "key" "registerEmailPrivateKey") }}
  # Empty until the operator sets it; a value set in the cluster is kept
  smtpPass: {{ include "gerrit.optionalSecretValue" (dict "ctx" . "name" (printf "%s-secure-config" $fullname) "key" "smtpPass") | quote }}
{{- end }}
{{- if and (include "gerrit.samlEnabled" .) (not .Values.auth.saml.existingSecret) }}
{{- $name := printf "%s-saml" $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  annotations:
    {{- include "gerrit.keepAnnotations" . | nindent 4 }}
type: Opaque
data:
  # Empty until the operator fills them; values set in the cluster are kept
  {{- range list "samlKeystore.jks" "keystore-password" "private-key-password" "idp-metadata.xml" }}
  {{ . }}: {{ include "gerrit.optionalSecretValue" (dict "ctx" $ "name" $name "key" .) | quote }}
  {{- end }}
{{- end }}
{{- if and (include "gerrit.g2pEnabled" .) (not .Values.hooks.g2p.existingSecret) }}
{{- $name := printf "%s-g2p" $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  annotations:
    {{- include "gerrit.keepAnnotations" . | nindent 4 }}
type: Opaque
data:
  # Empty until the operator fills it; a value set in the cluster is kept
  gerrit_to_platform.ini: {{ include "gerrit.optionalSecretValue" (dict "ctx" . "name" $name "key" "gerrit_to_platform.ini") | quote }}
{{- end }}
{{- if and (include "gerrit.itsJiraEnabled" .) (not (index .Values.plugins "its-jira").existingSecret) }}
{{- $name := printf "%s-its-jira" $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  annotations:
    {{- include "gerrit.keepAnnotations" . | nindent 4 }}
type: Opaque
data:
  # Empty until the operator fills them; values set in the cluster are kept
  {{- range list "username" "password" }}
  {{ . }}: {{ include "gerrit.optionalSecretValue" (dict "ctx" $ "name" $name "key" .) | quote }}
  {{- end }}
{{- end }}
