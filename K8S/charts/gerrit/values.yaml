# Default values for the gerrit chart: one Gerrit primary per release.

nameOverride: ""
fullnameOverride: ""

image:
  # Placeholder until the published image exists; build the image from
  # this repository's Dockerfile and override repository and tag.
  repository: ghcr.io/lfreleng-actions/gerrit
  tag: ""                         # defaults to the chart appVersion
  digest: ""                      # sha256:...; takes precedence over tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

gerrit:
  host: gerrit.example.org        # gerrit.canonicalWebUrl host
  urlPrefix: /r                   # served path prefix; "" for root
  # Scheme of gerrit.canonicalWebUrl, without the chart's Ingress
  webScheme: https
  # proxy-https behind a TLS-terminating proxy; http for direct access.
  # With ingress.enabled the chart derives both schemes instead.
  listenScheme: proxy-https
  instanceId: ""
  # Site identity, stamped on every change. Leave empty for a new site
  # and Gerrit generates one; the chart then keeps the site's own ID on
  # every start. When set it must match the site's ID, or site-init
  # fails before Gerrit starts. Copy it from the source site's
  # gerrit.config when importing.
  serverId: ""
  # Appended verbatim to gerrit.config, for settings with no typed
  # value below. A key here adds a second entry beside a typed one
  # rather than replacing it.
  extraConfig: ""

# The sections below render into etc/gerrit.config, which site-init
# replaces from the chart at every start. Each key is the Gerrit key of
# the same name (config-gerrit.html); null or "" leaves it out so
# Gerrit's own default applies, a list repeats the key, and a map under
# a section renders a subsection such as [cache "diff"]. Secrets never
# go here: render-config writes them to etc/secure.config.

# httpd.listenUrl is derived from gerrit.listenScheme and urlPrefix
httpd:
  maxQueued: null
  requestLog: null

# sshd.advertisedAddress is derived: ssh.host and the SSH port; see ssh
sshd:
  listenAddress: "*:29418"
  threads: null
  idleTimeout: null
  enableCompression: null

# auth.registerEmailPrivateKey comes from secrets.secureConfig
auth:
  # Smoke default only; never use it in production
  type: DEVELOPMENT_BECOME_ANY_ACCOUNT
  gitBasicAuthPolicy: null
  contributorAgreements: null
  editableAccountFields: []
  cookieSecure: null
  # SAML single sign-on through the saml library in the image
  # catalogue. Enabling it adds "saml" to the libraries site-init
  # copies, sets auth.type to HTTP and httpd.filterClass to the SAML
  # filter, and renders the [saml] section. See "SAML" in the chart
  # README.
  saml:
    enabled: false
    # Secret with samlKeystore.jks, keystore-password,
    # private-key-password and, with metadataFromSecret,
    # idp-metadata.xml. "" creates <fullname>-saml with empty keys the
    # operator fills in; under Argo CD name a pre-created Secret.
    existingSecret: ""
    # Identity provider metadata: a URL Gerrit fetches, or
    # idp-metadata.xml from the Secret; set exactly one
    metadataUrl: ""
    metadataFromSecret: false
    serviceProviderEntityId: ""   # "" for gerrit.canonicalWebUrl
    # Each key below is the [saml] key of the same name, left out when
    # null or "" so the module's default applies
    userNameAttr: null
    displayNameAttr: null
    emailAddressAttr: null
    firstNameAttr: null
    lastNameAttr: null
    computedDisplayName: false
    maxAuthLifetime: null
    # Assertion attribute naming the user's groups; set to turn on the
    # group sync into saml/<name> groups. See "Group membership sync"
    # in the chart README.
    memberOfAttr: null

# sendemail.smtpPass comes from secrets.secureConfig
sendemail:
  # Gerrit's default is true, with a relay on localhost the pod lacks
  enable: false
  smtpServer: null
  smtpServerPort: null
  smtpEncryption: null
  from: null
  smtpUser: null

# The chart always sets the JVM options the image needs, and a heap of
# 70% of resources.limits.memory unless heapLimit is set.
container:
  user: gerrit
  heapLimit: null
  javaOptions: []                 # extra options, one per entry

# cache.directory is always "cache" on the site volume. Each map
# renders one [cache "<name>"] subsection.
cache:
  # diskLimit of each persistent cache, rendered into its subsection
  # unless that sets diskLimit itself; null or "" drops one. Gerrit
  # trims a cache over its limit once a day, at 1 AM server time.
  limits:
    comment_context: 128m
    conflicts: 128m
    diff_intraline: 512m
    diff_summary: 1g
    gerrit_file_diff: 1g
    git_file_diff: 1g
    git_modified_files: 512m
    modified_files: 1g

change:
  updateDelay: null
  mergeabilityComputationBehavior: null
  enableRobotComments: null
  allowBlame: null

receive:
  enableSignedPush: null
  maxObjectSizeLimit: null
  timeout: null

download:
  scheme: []
  command: []
  archive: []

index:
  type: null
  maxLimit: null
  onlineUpgrade: null

# Gerrit's built-in gc scheduler, weekly and off-peak by default
gc:
  startTime: Sun 03:00
  interval: 1 week
  aggressive: null
  # Run git gc from a CronJob outside Gerrit's JVM instead. The modes
  # are exclusive: with the CronJob enabled, gerrit.config leaves
  # startTime and interval out and Gerrit's scheduler stays off.
  cronJob:
    enabled: false
    schedule: "0 3 * * 0"
    timeZone: ""                  # e.g. Etc/UTC; "" for the controller's
    # git gc options, each passed to git as one argument; with --auto
    # git packs a repository only once it holds more loose objects
    # than gc.auto in jgit.config allows, and [] runs a full gc
    args:
      - --auto
    resources: {}

plugins:
  allowRemoteAdmin: false
  # Health checks through the healthcheck plugin. Enabling it adds
  # healthcheck to the plugins site-init copies from the image
  # catalogue, renders etc/healthcheck.config and points the readiness
  # and liveness probes at <urlPrefix>/config/server/healthcheck~status
  # instead of the version endpoint. Off until the image catalogue
  # ships healthcheck.jar (#231), since site-init fails on a missing
  # jar; the default then becomes true. See "Health checks" in the
  # chart README.
  healthcheck:
    enabled: false
    # etc/healthcheck.config: keys under [healthcheck], such as
    # timeout, and one map per check, such as querychanges, rendered
    # as its [healthcheck "<check>"] subsection with enabled, timeout
    # and the check's own keys. The auth check logs in with a fixed
    # account a site rarely has, so it is off unless set here.
    config:
      auth:
        enabled: false
  # Prometheus metrics through the metrics-reporter-prometheus plugin.
  # Enabling it adds the plugin to the plugins site-init copies from
  # the image catalogue and writes the bearer token from
  # metrics.existingSecret to secure.config. See "Metrics" in the
  # chart README.
  metrics-reporter-prometheus:
    enabled: false
  # Jira integration through the its-jira plugin, which has its-base
  # compiled in. Enabling it adds its-jira to the plugins site-init
  # copies from the image catalogue and renders [its-jira],
  # [plugin "its-jira"] and etc/its/actions-its-jira.config. See
  # "Issue tracker" in the chart README.
  its-jira:
    enabled: false
    url: ""                       # [its-jira] url, the Jira API URL
    # Secret with username and password (or an API token in
    # password). "" creates <fullname>-its-jira with empty keys the
    # operator fills in; under Argo CD name a pre-created Secret.
    existingSecret: ""
    association: OPTIONAL         # MANDATORY | SUGGESTED | OPTIONAL
    # Each adds a rule to etc/its/actions-its-jira.config that comments
    # on the associated issues at that event
    commentOnChangeCreated: false
    commentOnPatchSetCreated: false
    commentOnChangeMerged: false
    commentOnChangeAbandoned: false
    # Appended verbatim to etc/its/actions-its-jira.config, for rules
    # and actions the toggles above do not cover
    extraConfig: ""

# Scraping of plugins.metrics-reporter-prometheus
metrics:
  # Secret with key token, the bearer token Prometheus presents. ""
  # creates <fullname>-metrics with a random token; under Argo CD name
  # a pre-created Secret.
  existingSecret: ""
  # A Prometheus Operator ServiceMonitor for the <fullname>-http
  # Service, rendered only where the cluster serves the
  # monitoring.coreos.com/v1 API
  serviceMonitor:
    enabled: false
    labels: {}                    # e.g. the release label Prometheus selects
    interval: 60s
    scrapeTimeout: ""             # "" for Prometheus' default

# [log] in gerrit.config. The chart configures logging through
# etc/log4j.properties: the error log goes to the container's stderr
# as JSON, one object per line, and httpd_log and sshd_log stay in
# logs/ on the site volume for audit. Gerrit ignores jsonLogging and
# textLogging for its error log under that file, but they rename the
# request log appenders it looks up and can disable request logging,
# so the chart refuses both. See "Logs" in the chart README.
log:
  rotate: true                    # daily, with the date in the name
  compress: true                  # gzip each rotated log

# The container's JSON error log, and retention of the rotated logs
# under logs/ on the site volume
logs:
  # Lowest log4j level the error log writes: ERROR, WARN, INFO, DEBUG...
  level: INFO
  # Delete rotated logs older than this many days from the
  # <fullname>-log-cleanup CronJob; 0 keeps them and renders no CronJob
  retentionDays: 0
  schedule: "30 4 * * *"
  timeZone: ""                    # e.g. Etc/UTC; "" for the controller's
  resources: {}

# Server-side hooks through the hooks plugin. Enabling it adds "hooks"
# to the plugins site-init copies from the image catalogue and renders
# the [hooks] section. See "Hooks" in the chart README.
hooks:
  enabled: false
  # Hooks directory under the site; the chart owns its contents
  path: hooks
  syncHookTimeout: 30
  # Hook scripts by hook name, such as ref-updated, each written to
  # <path>/<name> with mode 0755 at every start
  scripts: {}
  # gerrit-to-platform, installed in the image, as the handler of the
  # hooks listed below. Needs replication.enabled with a remote: g2p
  # finds the platform and repositories in replication.config.
  g2p:
    enabled: false
    # Secret with key gerrit_to_platform.ini. "" creates
    # <fullname>-g2p with an empty key the operator fills in; under
    # Argo CD name a pre-created Secret.
    existingSecret: ""
    hooks:
      - patchset-created
      - comment-added
      - change-merged

# Free-form sections; for trackingid each map is one subsection, for
# example {jira: {match: "...", system: JIRA, link: "..."}}
user: {}
trackingid: {}
accounts: {}
suggest: {}

# etc/jgit.config and etc/notedb.config, rendered the same way: each
# top-level key is a section, for example {core: {packedGitLimit: 1g}}
jgit:
  # Gerrit packs through gc above, never after each push
  receive:
    autogc: false
notedb: {}

# Plugins and libraries copied into the site from the image catalogue
# at every start. Each name is a jar basename without ".jar".
pluginCatalogue:
  path: /var/gerrit-catalogue
  plugins: []
  libs: []

# Push replication from this Gerrit to other remotes through the core
# replication plugin. Enabling it adds "replication" to the plugins
# site-init copies from the image catalogue, renders
# etc/replication.config and mounts the SSH material at
# /var/gerrit/.ssh. See "Replication" in the chart README.
replication:
  enabled: false
  autoReload: true                # [gerrit] autoReload
  lockErrorMaxRetries: 5          # [replication] globals
  maxRetries: 5
  # Secret with id_ed25519 (or id_rsa) and optionally known_hosts,
  # mounted at /var/gerrit/.ssh with mode 0400; "" mounts no key
  sshKeySecret: ""
  # Extra known_hosts lines; GitHub's published host keys are
  # included always
  knownHosts: ""
  # One [remote "<name>"] section per entry. Every key but name is a
  # replication.config key of the same name, rendered only when set;
  # a list repeats the key. For example:
  #   - name: github
  #     url: git@github.com:example-org/${name}.git
  #     authGroup: GitHub Replication
  #     push: ["+refs/*:refs/*"]
  #     remoteNameStyle: dash
  #     threads: 5
  #     timeout: 5
  #     projects: []
  #     replicatePermissions: true
  #     mirror: false
  #     replicationDelay: 15
  remotes: []

persistence:
  storageClassName: ""
  size: 20Gi
  # Root init container that chowns the site volume, for provisioners
  # that ignore fsGroup (kind's local-path). It runs as root, so the
  # namespace cannot enforce the restricted Pod Security level.
  volumePermissions:
    enabled: false

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 4Gi

# The chart generates each Secret once and reuses its values on upgrade
# through lookup. A GitOps tool that renders offline, such as Argo CD,
# sees no existing values and would replace them at every sync: create
# the Secrets outside the chart and name them here instead.
secrets:
  admin:
    existingSecret: ""            # keys: username, password
  secureConfig:
    # keys: registerEmailPrivateKey, and smtpPass when the relay
    # needs a password
    existingSecret: ""

# HTTP access through the cluster's Ingress controller. TLS ends at
# the controller, and Gerrit listens on proxy-https:// behind it, or
# proxy-http:// with tls.enabled false.
ingress:
  enabled: false
  className: ""                   # e.g. traefik or nginx
  annotations: {}                 # added to the chart's own; win on a clash
  tls:
    enabled: true
    secretName: ""                # defaults to <fullname>-tls
    # cert-manager ClusterIssuer that issues the Secret; "" to create
    # the Secret yourself
    issuer: letsencrypt-prod
  redirectRootToPrefix: true      # "/" -> "<urlPrefix>/"
  securityHeaders:
    # CSP, HSTS, Referrer-Policy, Permissions-Policy and
    # X-Content-Type-Options; rendered with traefik.enabled only
    enabled: true
    contentSecurityPolicy: ""     # "" for the chart's default policy
  traefik:
    # Render a Traefik IngressRoute and Middlewares instead of a plain
    # Ingress; needs Traefik's CRDs, and cert-manager's with tls.issuer
    enabled: false
    entryPoints: []               # [] for Traefik's default entry points

ssh:
  # Host clients use for SSH, without a port; defaults to gerrit.host.
  # sshd.advertisedAddress is this host followed by the SSH port.
  host: ""
  # Port clients use for SSH, for when something in front publishes
  # 29418 on another port; null for service.nodePort with a NodePort
  # Service, else 29418
  port: null
  service:
    enabled: true
    type: LoadBalancer
    # Fixed node port with type NodePort, and the advertised port unless
    # ssh.port is set; a NodePort Service needs this or ssh.port
    nodePort: null
    # For an AWS NLB through the AWS Load Balancer Controller:
    #   service.beta.kubernetes.io/aws-load-balancer-type: external
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    annotations: {}
    # Local keeps the client address, so sshd_log records it; applies to
    # LoadBalancer and NodePort Services only
    externalTrafficPolicy: Local
    # Add external-dns.alpha.kubernetes.io/hostname: <ssh.host>
    externalDNS: false

networkPolicy:
  enabled: true
  # Namespaces that may reach port 8080, as a label selector; {} admits
  # any source. For example:
  #   matchLabels:
  #     kubernetes.io/metadata.name: traefik
  ingressNamespaceSelector: {}
  # Namespaces of the Prometheus that scrapes the metrics plugin, as a
  # label selector, admitted to port 8080 beside those
  # ingressNamespaceSelector selects. Used only with that selector set
  # and plugins.metrics-reporter-prometheus enabled; {} adds none.
  metricsNamespaceSelector: {}

# DNS domain of the cluster, for the Gerrit pod's name the admin
# toolbox looks up
clusterDomain: cluster.local

# Optional admin toolbox: a Deployment on the Gerrit image with the
# site volume mounted, for offline maintenance while Gerrit is scaled
# to zero. See "Admin toolbox" in the chart README.
toolbox:
  enabled: false
  replicas: 0                     # scale to 1 for a session, then back
  # Secret with key ssh-privatekey: an administrator's SSH identity,
  # mounted at /etc/gerrit-toolbox/ssh/id with mode 0400; "" mounts none
  existingSecret: ""
  resources: {}

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
