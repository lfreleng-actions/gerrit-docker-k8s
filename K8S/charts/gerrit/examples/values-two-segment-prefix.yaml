# Synthetic example: Gerrit under a two-segment URL prefix behind a
# Traefik IngressRoute, with cache limits, garbage collection, user
# defaults, a free-form block for a setting the chart has no typed
# value for, and push replication to a GitHub organisation and to a
# plain git mirror. CI lints and renders the chart with every file in
# this directory, and tests/chart compares each rendered gerrit.config
# and replication.config with a golden file.

gerrit:
  host: www.example.org
  urlPrefix: /code/review
  extraConfig: |
    [commentlink "changeid"]
    	match = (I[0-9a-f]{8,40})
    	link = "#/q/$1"

ingress:
  enabled: true
  className: traefik
  traefik:
    enabled: true
    entryPoints:
      - websecure

httpd:
  maxQueued: 200
  requestLog: true

cache:
  accounts:
    memoryLimit: 4096
  web_sessions:
    maxAge: 30 days

gc:
  startTime: Sat 02:00
  interval: 1 week
  aggressive: false

user:
  name: Gerrit Code Review
  email: gerrit@example.org

accounts:
  visibility: SAME_GROUP

suggest:
  maxSuggestedReviewers: 20

replication:
  enabled: true
  sshKeySecret: gerrit-replication-ssh
  knownHosts: |
    [git.example.org]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGitExampleOrgHostKeyPlaceholder
  remotes:
    - name: github
      url: git@github.com:example-org/${name}.git
      authGroup: GitHub Replication
      push:
        - +refs/heads/*:refs/heads/*
        - +refs/tags/*:refs/tags/*
      remoteNameStyle: dash
      threads: 5
      timeout: 5
      replicatePermissions: false
      replicationDelay: 15
    - name: mirror
      url: ssh://git@git.example.org:2222/mirrors/${name}.git
      push:
        - +refs/*:refs/*
      mirror: true
      projects:
        - ^example/.*
