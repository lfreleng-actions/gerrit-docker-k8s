# Local smoke overlay for kind or Docker Desktop. Load the chart image
# built from this repository's Dockerfile and Dockerfile.chart first,
# for example:
#   docker build -t gerrit-local-base:dev .
#   docker build -f Dockerfile.chart \
#     --build-arg BASE_IMAGE=gerrit-local-base:dev -t gerrit-local:dev .
#   kind load docker-image gerrit-local:dev

image:
  repository: gerrit-local
  tag: dev
  pullPolicy: Never

gerrit:
  host: localhost:8080
  webScheme: http
  listenScheme: http

# Development accounts, on purpose: verify-site.py and verify-hook.py
# sign in as the site's first account through them
auth:
  type: DEVELOPMENT_BECOME_ANY_ACCOUNT
  allowDevelopmentAccounts: true

persistence:
  size: 2Gi
  volumePermissions:
    enabled: true

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# kind has no load balancer, so a LoadBalancer Service never gets the
# address helm install --wait waits for; sshd still advertises
# localhost:29418, from gerrit.host
ssh:
  service:
    enabled: false

# hooks comes from the image's plugin catalogue. The stub hook logs
# each call, so verify-hook.py --hook-log can check a change runs it.
hooks:
  enabled: true
  scripts:
    patchset-created: |
      #!/bin/sh
      echo "$*" >> /var/gerrit/logs/smoke-hook.log
