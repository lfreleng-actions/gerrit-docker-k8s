# Local smoke overlay for kind or Docker Desktop. Load an image built
# from this repository's Dockerfile first, for example:
#   docker build -t gerrit-local:dev .
#   kind load docker-image gerrit-local:dev

image:
  repository: gerrit-local
  tag: dev
  pullPolicy: Never

gerrit:
  host: localhost:8080
  webScheme: http
  listenScheme: http

persistence:
  size: 2Gi
  volumePermissions:
    enabled: true

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# kind has no load balancer, so a LoadBalancer Service never gets the
# address helm install --wait waits for; sshd still advertises
# localhost:29418, from gerrit.host
ssh:
  service:
    enabled: false

# The official image ships the hooks plugin in /var/gerrit/plugins,
# which site-init still sees from the image. The stub hook logs each
# call, so verify-hook.py --hook-log can check a change runs it.
pluginCatalogue:
  path: /var/gerrit

hooks:
  enabled: true
  scripts:
    patchset-created: |
      #!/bin/sh
      echo "$*" >> /var/gerrit/logs/smoke-hook.log
