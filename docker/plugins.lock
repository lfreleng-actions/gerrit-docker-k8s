#
# Plugin catalogue for the chart image (Dockerfile.chart). Each line
# pins one GerritForge CI artefact by build number and sha256:
#
#   <dir>/<name> <url> <sha256>
#
# <dir> is the catalogue directory, plugins/ or lib/, under
# /var/gerrit-catalogue, and the jar lands there as <name>.jar. Every
# entry builds from the stable-3.13 branch, matching GERRIT_VERSION in
# the Dockerfile. When a plugin has no green build for that line, pin
# the newest green build from the previous line and say so in a comment
# above its entry.
#
# Check:   bash scripts/check-plugin-lock.sh [--verify]
# Refresh: bash scripts/check-plugin-lock.sh --refresh [NAME...]
