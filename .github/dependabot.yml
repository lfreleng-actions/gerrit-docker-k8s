version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(actions)"
    # Wait before opening a bump PR so we don't churn on a release
    # that gets retracted or superseded shortly after it ships.
    # This is required to satisfy the zizmor workflow auditing tool.
    cooldown:
      default-days: 7
      # Our own organisation's actions and reusable workflows skip the
      # cooldown: we review those releases ourselves, and their fixes
      # need to reach callers without a week's delay.
      exclude:
        - "lfreleng-actions/*"
    open-pull-requests-limit: 15

  # Root project dependencies are managed with uv (pyproject.toml +
  # uv.lock); the uv ecosystem tracks the dev/test toolchain.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15

  # The extended Gerrit Docker image installs a separate set of
  # hash-pinned runtime dependencies (gerrit-to-platform, requests)
  # from docker/requirements*.txt, which are pip-managed rather than
  # part of the root uv lockfile.
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 5

  # The action installs the scripts' runner-side dependencies from
  # hash-pinned scripts/requirements.txt into its own virtual
  # environment; pip-managed, like the image's requirements above.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 5

  # The Dockerfile base image (gerritcodereview/gerrit); grouped so a
  # base image bump arrives as a single pull request. Updates stay on
  # the 3.13 line: the chart image's plugin catalogue (docker/plugins.lock)
  # pins stable-3.13 builds, and moving Gerrit's minor line means
  # re-pinning it. Major JDK (eclipse-temurin) updates are ignored too:
  # Gerrit supports Java 21 only, and the Dockerfile pins and checks a
  # 21.x JDK, so moving to a new Java line is a deliberate change made
  # alongside that version check. Minor, patch and digest updates on
  # the 21 line still flow, as they carry the JDK security fixes.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "gerritcodereview/gerrit"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
