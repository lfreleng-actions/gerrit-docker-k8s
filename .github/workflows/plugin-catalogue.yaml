---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Mirror the plugin catalogue docker/plugins.lock pins to GHCR.
#
# GerritForge CI discards old builds, so the image build should not
# depend on it keeping the ones the lock pins. This workflow keeps a
# copy: one OCI artifact holding every pinned jar as a layer, each
# annotated with its lock entry, plus the lock itself, at
#
#   ghcr.io/<owner>/<repo>/plugin-catalogue:<sha256 of the lock>
#
# The tag is the lock's own sha256, so a consumer computes it from the
# lock it holds (bash scripts/plugin-catalogue.sh tag) and needs no
# recorded digest. A tag that already exists is left alone. Consumers
# still check every jar against the lock's sha256: the mirror is a
# copy, not a trust anchor. The artifact is signed with cosign,
# keyless, as the release workflow signs images.

name: 'Plugin Catalogue Mirror 🧩'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['docker/plugins.lock']

permissions: {}

# One publication per commit at a time; never cancel one in flight, or
# a pushed artifact could be left unsigned. A group holds one pending
# run, so a shared group would let a newer lock revision displace an
# older one's queued run and leave that revision unmirrored.
concurrency:
  group: 'plugin-catalogue-${{ github.sha }}'
  cancel-in-progress: false

jobs:
  mirror:
    name: 'Mirror the plugin catalogue'
    # Publish only what main pins, so every signature names main
    if: github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read  # Checkout repository contents
      packages: write  # Push the artifact and its signature to GHCR
      id-token: write  # Keyless cosign signing uses OIDC
    timeout-minutes: 20
    env:
      REPO: 'ghcr.io/${{ github.repository }}/plugin-catalogue'
      ARTIFACT_TYPE: 'application/vnd.linuxfoundation.releng.gerrit-plugin-catalogue.v1'
    steps:
      # The artefacts come from GerritForge CI, which the organisation
      # allow-list lacks. This repository's supplemental list adds it.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@bd83615a22b57835798adcb9ce753161464dfb40  # v0.16.2
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: '${{ github.repository }}//.github/harden-runner/allow_list.txt@${{ github.sha }}'
          supplemental_required: 'true'
          token: ${{ github.token }}

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup-oras checks the download against its own checksum list
      - name: 'Install oras'
        # yamllint disable-line rule:line-length
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
        with:
          version: '1.3.1'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # oras and cosign read the credentials docker login stores
      - name: 'Log in to GitHub Container Registry'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Check for an existing mirror'
        id: existing
        shell: bash
        run: |
          # Check for an existing mirror
          set -euo pipefail
          tag="$(bash scripts/plugin-catalogue.sh tag)"
          ref="${REPO}:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if digest="$(oras resolve "${ref}" 2>"${RUNNER_TEMP}/resolve.err")"; then
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::oras resolved ${ref} to '${digest}' ❌" >&2
              exit 1
            fi
            echo "::notice::${ref} already exists (${digest}); skipping the push"
            {
              echo "exists=true"
              echo "digest=${digest}"
            } >> "$GITHUB_OUTPUT"
          elif grep -qi 'not found' "${RUNNER_TEMP}/resolve.err"; then
            echo "${ref} does not exist yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "${RUNNER_TEMP}/resolve.err" >&2
            echo "::error::Cannot tell whether ${ref} exists ❌" >&2
            exit 1
          fi

      - name: 'Download and verify the pinned artefacts'
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          SOURCE: '${{ github.server_url }}/${{ github.repository }}'
          REVISION: ${{ github.sha }}
        run: |
          # Download and verify the pinned artefacts
          set -euo pipefail
          bash scripts/plugin-catalogue.sh \
            --annotation "org.opencontainers.image.source=${SOURCE}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            stage "${RUNNER_TEMP}/plugin-catalogue"

      - name: 'Push the artifact'
        id: push
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.existing.outputs.tag }}
        run: |
          # Push the artifact
          set -euo pipefail
          cd "${RUNNER_TEMP}/plugin-catalogue"
          mapfile -t files < files.txt
          digest="$(oras push "${REPO}:${TAG}" \
            --artifact-type "${ARTIFACT_TYPE}" \
            --annotation-file annotations.json \
            --format go-template='{{.digest}}' \
            "${files[@]}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No digest in the oras push output: '${digest}' ❌" >&2
            exit 1
          fi
          echo "Pushed ${REPO}:${TAG} (${digest})"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Sign a fresh push, or an existing artifact that a failed run
      # left without this workflow's signature
      - name: 'Sign the artifact (keyless OIDC)'
        id: sign
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          IDENTITY: '${{ github.server_url }}/${{ github.repository }}/.github/workflows/plugin-catalogue.yaml@refs/heads/main'
        run: |
          # Sign the artifact
          set -euo pipefail
          ref="${REPO}@${DIGEST}"
          if cosign verify "${ref}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null 2>&1; then
            echo "::notice::${ref} already carries this workflow's signature"
          else
            cosign sign --yes "${ref}"
          fi
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"

      - name: 'Mirror summary'
        shell: bash
        env:
          TAG: ${{ steps.existing.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          EXISTED: ${{ steps.existing.outputs.exists }}
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          # Mirror summary
          set -euo pipefail
          {
            echo "## Plugin catalogue mirror"
            echo ""
            if [[ "${EXISTED}" == 'true' ]]; then
              echo "\`${REPO}:${TAG}\` already existed; nothing was pushed."
            else
              echo "Pushed \`${REPO}:${TAG}\`."
            fi
            echo ""
            echo "- Reference: \`${REPO}:${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo '```sh'
            echo "cosign verify ${REPO}@${DIGEST} \\"
            echo "  --certificate-identity ${IDENTITY} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo ""
            echo "> [!NOTE]"
            echo "> GHCR creates the \`plugin-catalogue\` package private. Once,"
            echo "> after the first run, set it public in the package settings"
            echo "> so builds can pull it anonymously."
          } >> "$GITHUB_STEP_SUMMARY"
