---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Release workflow: build, test, publish, sign, promote.
#
# Triggered by a semver tag push (e.g. `v1.0.0` or `v1.0.0-rc1`). The
# tag must be signed and well formed; tag-validate enforces that before
# anything else runs. Modelled on the sigul-docker-k8s release
# workflow, trimmed to the one image this repository publishes:
# ghcr.io/<owner>/<repo>/gerrit, built from Dockerfile.chart on top of
# the image Dockerfile builds.
#
# 1. Builds the image (linux/amd64) and exports it as an artefact.
# 2. Smoke-tests it: the Gerrit version, the plugin catalogue, a
#    `--dev --batch` site init and the HTTP endpoint of a running
#    container.
# 3. Generates an SPDX SBOM and audits it with Grype, before anything
#    is published, so a failing image never reaches GHCR. The tagged
#    .grype.yaml accepts named, version-pinned findings.
# 4. Publishes the image to GHCR as vX.Y.Z, then, one tag run at a
#    time, moves X.Y, X and latest to it while it is the newest final
#    tag each covers; a pre-release tag publishes only its own tag.
# 5. Signs the published image (cosign keyless) and attaches
#    build-provenance and SBOM attestations.
# 6. Publishes the Helm chart to oci://ghcr.io/<owner>/<repo>/charts,
#    pinned to the digest of the image step 4 published, with the
#    chart version taken from the tag; signs and attests it like the
#    image.
# 7. Attaches the SBOM, the Grype reports and the packaged chart to the
#    GitHub release and promotes the draft release.
#
# The GitHub Action in this repository does not use this image: it
# still builds Dockerfile at run time.

name: 'Release on Tag Push 🚀'

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

# Serialise repeated runs for the same tag; never cancel an in-flight
# release. Runs for different tags overlap, so the two jobs that move
# shared state (the image aliases and the 'latest' release badge) also
# share a job-level queue across tags, and each checks for a newer
# final tag inside it.
concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

env:
  IMAGE: 'ghcr.io/${{ github.repository }}/gerrit'

jobs:
  repository-metadata:
    name: 'Repository Metadata'
    # Deleting a tag also fires the push event; start nothing then
    if: ${{ !github.event.deleted }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Checkout repository contents
      pull-requests: read  # Gather pull request metadata
    timeout-minutes: 5
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@ad59def638674f45db5c8084a03db60f52cdd3ea  # v0.3.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: 'false'
          artifact_upload: 'true'
          artifact_formats: 'json'

  ### Validate the pushed tag (parallel with repository-metadata) ###
  tag-validate:
    name: 'Validate Tag'
    if: ${{ !github.event.deleted }}
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read  # Read the tag and its history
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.validate.outputs.tag_name }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The release-gating policy the generic-workflows reusable this
      # workflow replaces applied, except that pre-release tags pass:
      # a pre-release tag publishes a pre-release image.
      - name: 'Validate tag'
        id: validate
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@5665ecc8efdb71a353e00589865220124bb8c3c5  # v1.1.10
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          require_type: 'semver'
          require_signed: 'ssh,gpg-unverifiable'
          # The tag's signing key must belong to the tagger's account
          require_github: true
          reject_development: false
          enforce_increment: true
          require_branch: 'true'
          require_recent: 'true'
          require_latest: true

  ### Build the image ###
  build:
    name: 'Build (${{ matrix.platform }})'
    needs: [repository-metadata, tag-validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read  # Checkout repository contents
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # linux/arm64 would add a leg here, on 'ubuntu-24.04-arm', once
        # the Dockerfile installs uv for that architecture
        include:
          - platform: 'linux/amd64'
            platform-id: 'linux-amd64'
            runner: 'ubuntu-24.04'
    steps:
      # The image build pulls the plugin catalogue from its GHCR
      # mirror, or from GerritForge CI when the lock has no mirror.
      # The organisation allow-list lacks GerritForge; this
      # repository's supplemental list adds it, read at the tagged
      # commit.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          # yamllint disable-line rule:line-length
          supplemental_config: '${{ github.repository }}//.github/harden-runner/allow_list.txt@${{ github.sha }}'
          supplemental_required: 'true'
          token: ${{ github.token }}

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pulls from Docker Hub count against an account, when the
      # repository has one, rather than the runner's shared anonymous
      # rate limit. Without Docker Hub secrets the login skips and the
      # images pull anonymously.
      - name: 'Check for Docker Hub credentials'
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Check for Docker Hub credentials
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            echo "login=false" >> "$GITHUB_OUTPUT"
            echo "No Docker Hub credentials; pulling anonymously"
          fi

      - name: 'Log in to Docker Hub'
        if: steps.dockerhub.outputs.login == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The standard OCI label set (revision, version, created and so
      # on) from the workflow context; it survives the tar export
      - name: 'Compute OCI image metadata'
        id: meta
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Gerrit for Kubernetes
            org.opencontainers.image.description=Gerrit Code Review with a plugin catalogue for the Helm chart

      # setup-oras checks the download against its own checksum list
      - name: 'Install oras'
        # yamllint disable-line rule:line-length
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
        with:
          version: '1.3.1'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # Dockerfile.chart starts from the image Dockerfile builds. The
      # docker driver builds both into the local image store, where the
      # second build finds the first; no registry is involved. Each
      # matrix leg builds natively on its runner. The release-build
      # job in testing.yaml repeats this job's egress steps and builds
      # on pull requests; keep the two in step.
      - name: 'Build the image'
        shell: bash
        env:
          META_LABELS: ${{ steps.meta.outputs.labels }}
          PLATFORM_ID: ${{ matrix.platform-id }}
        run: |
          # Build the image
          set -euo pipefail
          labels=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && labels+=(--label "$label")
          done <<< "$META_LABELS"
          docker build -t gerrit-base:build .
          bash scripts/fetch-plugin-catalogue.sh build/plugin-catalogue
          docker build -f Dockerfile.chart \
            --build-arg BASE_IMAGE=gerrit-base:build \
            "${labels[@]}" \
            -t "gerrit:${PLATFORM_ID}" .
          docker save -o "/tmp/gerrit-${PLATFORM_ID}.tar" \
            "gerrit:${PLATFORM_ID}"

      - name: 'Upload image artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gerrit-${{ matrix.platform-id }}-image
          path: /tmp/gerrit-${{ matrix.platform-id }}.tar
          retention-days: 7
          if-no-files-found: error

  ### Smoke-test the built image ###
  smoke:
    name: 'Smoke test'
    needs: [build]
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read  # Checkout repository contents
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Download image artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: gerrit-linux-amd64-image
          path: /tmp

      - name: 'Load the image'
        shell: bash
        run: |
          # Load the image
          set -euo pipefail
          docker load --input /tmp/gerrit-linux-amd64.tar

      # The image entrypoint starts Gerrit whatever the arguments, so
      # one-off commands override it
      - name: 'Check the Gerrit version'
        shell: bash
        run: |
          # Check the Gerrit version
          set -euo pipefail
          pinned=$(sed -n 's/^ARG GERRIT_VERSION=//p' Dockerfile)
          want="gerrit version ${pinned%%-*}"
          got=$(docker run --rm --entrypoint java gerrit:linux-amd64 \
            -jar /var/gerrit/bin/gerrit.war version)
          echo "$got"
          if ! grep -qxF "$want" <<< "$got"; then
            echo "::error::Expected '$want', got '$got' ❌"
            exit 1
          fi
          echo "Gerrit ${pinned%%-*} as pinned ✅"

      - name: 'Check the plugin catalogue'
        shell: bash
        run: |
          # Check the plugin catalogue
          set -euo pipefail
          # Lock entries, then the core plugins site-init expects
          mapfile -t jars < <(grep -Ev '^[[:space:]]*(#|$)' \
            docker/plugins.lock | awk '{print $1}')
          jars+=(plugins/replication plugins/hooks plugins/webhooks
            plugins/delete-project plugins/download-commands)
          docker run --rm --entrypoint bash gerrit:linux-amd64 -c '
            set -eu
            cd /var/gerrit-catalogue
            for jar in "$@"; do
              test -f "$jar.jar" || { echo "missing: $jar.jar" >&2; exit 1; }
            done
            bad=$(find . -type f \( ! -user root -o ! -perm 0644 \))
            test -z "$bad" || { echo "not root 0644: $bad" >&2; exit 1; }
            ls -lR .
          ' bash "${jars[@]}"
          echo "Catalogue holds ${#jars[@]} expected jars ✅"

      - name: 'Initialise a development site'
        shell: bash
        run: |
          # Initialise a development site
          set -euo pipefail
          docker run --rm --entrypoint java gerrit:linux-amd64 \
            -jar /var/gerrit/bin/gerrit.war init \
            --dev --batch --no-auto-start -d /tmp/site
          echo "gerrit init --dev --batch succeeded ✅"

      # While Gerrit starts, the endpoint first resets the connection,
      # then answers 302 with an empty body (a fresh development site
      # redirects the first visitor to log in), and only then 200 with
      # the version. Only that 200 shows Gerrit is serving, so any
      # other status, or a body without the pinned version, is retried
      # rather than followed or failed.
      - name: 'Check the HTTP endpoint'
        shell: bash
        run: |
          # Check the HTTP endpoint
          set -euo pipefail
          pinned=$(sed -n 's/^ARG GERRIT_VERSION=//p' Dockerfile)
          want="\"${pinned%%-*}\""
          docker run -d --name gerrit-smoke -p 127.0.0.1:8080:8080 \
            gerrit:linux-amd64
          url=http://127.0.0.1:8080/config/server/version
          body_file=$(mktemp)
          status=000
          body=''
          for _ in $(seq 1 60); do
            : > "$body_file"
            status=$(curl -sS --max-time 10 -o "$body_file" \
              -w '%{http_code}' "$url" 2>/dev/null) || true
            status=${status:-000}
            body=$(cat "$body_file")
            if [[ "$status" == 200 && "$body" == *"$want"* ]]; then
              echo "$body"
              echo "Gerrit answers on HTTP ✅"
              exit 0
            fi
            echo "Not ready yet: HTTP $status, body '${body}'"
            sleep 5
          done
          echo "::error::Gerrit did not answer HTTP 200 with $want on" \
            "$url; last HTTP $status, body '${body}' ❌"
          docker logs gerrit-smoke || true
          exit 1

      - name: 'Stop the container'
        if: always()
        shell: bash
        run: |
          # Stop the container
          docker rm -f gerrit-smoke >/dev/null 2>&1 || true

  ### Generate the SBOM (pre-publish) ###
  sbom:
    name: 'SBOM'
    needs: [build]
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Read workflow artefacts
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download image artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: gerrit-linux-amd64-image
          path: /tmp

      - name: 'Load the image'
        shell: bash
        run: |
          # Load the image
          set -euo pipefail
          docker load --input /tmp/gerrit-linux-amd64.tar

      - name: 'Generate SPDX SBOM'
        # yamllint disable-line rule:line-length
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: 'gerrit:linux-amd64'
          format: spdx-json
          output-file: sbom-gerrit.spdx.json
          # The upload below names the artefact; avoid a duplicate
          upload-artifact: false

      - name: 'Upload SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-gerrit
          path: sbom-gerrit.spdx.json
          retention-days: 90
          if-no-files-found: error

      - name: 'SBOM summary'
        shell: bash
        run: |
          # SBOM summary
          set -euo pipefail
          count=$(jq '[.packages[]?] | length' sbom-gerrit.spdx.json)
          {
            echo "## SBOM: gerrit"
            echo ""
            echo "SPDX package count: ${count}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Audit the SBOM with Grype (pre-publish gate) ###
  grype:
    name: 'Grype'
    needs: [tag-validate, sbom]
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Read workflow artefacts
      security-events: write  # Upload Grype SARIF to code scanning
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The tagged commit supplies .grype.yaml. It is trusted here
      # because it comes from the signed tag tag-validate checked.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-gerrit

      # Gates on fixable high and critical findings. An unfixable
      # advisory warns rather than blocking every release. .grype.yaml
      # accepts named findings in components this repository does not
      # build, each pinned to a package version (see the README's
      # "Vulnerability gate"). The NO_BLOCK_AUDIT_FAIL repository
      # variable lets an urgent release publish despite findings.
      - name: 'Grype audit SBOM'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@5c81b23afb2ea771b2d247807a12d90783328675  # v0.5.0
        with:
          sbom: 'sbom-gerrit.spdx.json'
          name: 'gerrit'
          config: '.grype.yaml'
          fail-on: 'high'
          only-fixed: 'true'
          permit-fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          bypass-enabled: 'false'
          output-formats: 'json,table,sarif'
          output-prefix: 'grype-gerrit'
          summary-title: 'Grype scan'
          upload-artifact: 'true'
          artifact-name: 'scan-gerrit'
          retention-days: 90

      # Every release records which findings .grype.yaml accepted, and
      # why. testing.yaml's release-build job repeats this step.
      - name: 'List accepted findings'
        if: always()
        shell: bash
        run: |
          # List accepted findings
          set -euo pipefail
          report=grype-gerrit.json
          if [[ ! -f "$report" ]]; then
            echo "::warning::No Grype JSON report to summarise"
            exit 0
          fi
          rows=$(jq -r '.ignoredMatches[]?
            | [.vulnerability.id, .vulnerability.severity,
               .artifact.name, .artifact.version,
               ([.appliedIgnoreRules[]?.reason
                 | select(. != null and . != "")] | join("; ")
                 | if . == "" then "Grype default rule" else . end)]
            | map(tostring | gsub("\\|"; "\\|"))
            | "| " + join(" | ") + " |"' "$report")
          {
            echo "## Grype: accepted findings"
            echo ""
            if [[ -z "$rows" ]]; then
              echo "None."
            else
              echo "| Finding | Severity | Package | Version | Reason |"
              echo "| --- | --- | --- | --- | --- |"
              echo "$rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload Grype SARIF to code scanning'
        if: always()
        # The SARIF also ships as a release asset; a transient upload
        # failure must not block the release
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: grype-gerrit.sarif
          category: grype-gerrit

  ### Publish to GHCR (gated on smoke and Grype) ###
  publish-ghcr:
    name: 'Publish'
    needs: [tag-validate, smoke, grype]
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Read workflow artefacts
      packages: write  # Push release container images to GHCR
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Log in to GitHub Container Registry'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Download image artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: gerrit-linux-amd64-image
          path: /tmp

      # Only the git tag's own name here, so sign-attest finds it; the
      # shared aliases move in publish-aliases, one tag run at a time
      - name: 'Push the image'
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Push the image
          set -euo pipefail
          docker load --input /tmp/gerrit-linux-amd64.tar
          docker tag gerrit:linux-amd64 "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
          echo "Published: ${IMAGE}:${TAG}"

  ### Move the shared image aliases (serialised across tags) ###
  publish-aliases:
    name: 'Publish aliases'
    # Aliases move only once vX.Y.Z is signed and attested, so no
    # shared tag ever points at an image that fails verification
    needs: [tag-validate, publish-ghcr, sign-attest]
    runs-on: 'ubuntu-latest'
    # One queue for every tag's run, shared with promote-release: the
    # newest-tag check and the alias moves happen inside it, so a run
    # for an older tag cannot interleave with a newer one's. 'max'
    # keeps every waiting job instead of cancelling all but the last.
    concurrency:
      group: 'release-shared-state'
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read  # List the repository's tags
      packages: write  # Move the shared image aliases in GHCR
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Log in to GitHub Container Registry'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release moves nothing. A final release moves each shared
      # alias (X.Y, X, latest) only while it is the newest final tag
      # that alias covers. A newer tag's run queues here after its tag
      # exists, so whichever order the runs take, the newest wins: an
      # older tag's run either sees the newer tag and stays put, or
      # moves first and is overwritten. The copy is registry-side and
      # keeps the digest, so the signature on vX.Y.Z covers the aliases.
      - name: 'Move the aliases'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Move the aliases
          set -euo pipefail
          re='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "${TAG}" =~ $re ]]; then
            echo "::error::'${TAG}' is not a vX.Y.Z[-pre] tag ❌" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "Pre-release ${TAG}: no shared alias moves"
            exit 0
          fi
          src="${IMAGE}:${TAG}"
          digest() {
            docker buildx imagetools inspect "$1" \
              --format '{{.Manifest.Digest}}'
          }
          want=$(digest "${src}")
          refs=$(gh api --paginate \
            "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")')
          mapfile -t finals < <(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            <<< "${refs}" | sort -V)
          newest() {
            printf '%s\n' "${finals[@]}" \
              | awk -v p="$1" 'index($0, p) == 1' | tail -n 1
          }
          moved=()
          for alias in "${major}.${minor}" "${major}" latest; do
            case "${alias}" in
              latest) prefix=v ;;
              *) prefix="v${alias}." ;;
            esac
            top=$(newest "${prefix}")
            if [[ "${top}" != "${TAG}" ]]; then
              echo "::warning::${top} is newer; '${alias}' stays put"
              continue
            fi
            docker buildx imagetools create --prefer-index=false \
              --tag "${IMAGE}:${alias}" "${src}"
            got=$(digest "${IMAGE}:${alias}")
            if [[ "${got}" != "${want}" ]]; then
              echo "::error::${alias} is ${got}, not ${want} ❌" >&2
              exit 1
            fi
            moved+=("${IMAGE}:${alias}")
          done
          echo "Moved to ${TAG} (${want}):"
          printf '  %s\n' "${moved[@]}"

  ### Sign and attest the published image ###
  sign-attest:
    name: 'Sign and attest'
    needs: [tag-validate, publish-ghcr, sbom]
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Read workflow artefacts
      packages: write  # Attach signatures/attestations as OCI referrers
      id-token: write  # Keyless cosign signing and attestations use OIDC
      attestations: write  # Write signed build attestations
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.ref.outputs.digest }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Log in to GitHub Container Registry'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bind signatures and attestations to the immutable digest
      # rather than the moving tag
      - name: 'Resolve the manifest digest'
        id: ref
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Resolve the manifest digest
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "::error::No manifest digest for ${IMAGE}:${TAG} ❌" >&2
            exit 1
          fi
          echo "Resolved ${IMAGE}:${TAG} -> ${digest}"
          {
            echo "digest=${digest}"
            echo "ref=${IMAGE}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: 'Sign image (keyless OIDC)'
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: 'Attest build provenance'
        env:
          # Some registries overflow Node's default 16KB response
          # header cap when attestations are pushed as referrers
          NODE_OPTIONS: '--max-http-header-size=32768'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true
          # Attestations live as OCI referrers and in the attestations
          # API, which is what gh attestation verify reads
          create-storage-record: false

      # Attest the exact SBOM the Grype gate scanned
      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-gerrit

      - name: 'Attest SBOM'
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          sbom-path: sbom-gerrit.spdx.json
          push-to-registry: true
          create-storage-record: false

  ### Publish the chart, pinned to the signed image ###
  publish-chart:
    name: 'Publish chart'
    needs: [tag-validate, publish-ghcr, sign-attest]
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read  # Checkout repository contents
      packages: write  # Push the chart and its signature to GHCR
      id-token: write  # Keyless cosign signing and attestations use OIDC
      attestations: write  # Write signed build attestations
    timeout-minutes: 15
    env:
      CHART_DIR: K8S/charts/gerrit
      CHART_REPO: 'ghcr.io/${{ github.repository }}/charts'
      TAG: ${{ needs.tag-validate.outputs.tag }}
    steps:
      # Helm comes from get.helm.sh, which this repository's
      # supplemental list adds, read at the tagged commit
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: '${{ github.repository }}//.github/harden-runner/allow_list.txt@${{ github.sha }}'
          supplemental_required: 'true'
          token: ${{ github.token }}

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install Helm'
        # yamllint disable-line rule:line-length
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.22.1'

      # The pin script and the digest check need PyYAML
      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # Helm reads the credentials docker login stores
      - name: 'Log in to GitHub Container Registry'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin to the versioned tag's digest, never an alias, and only to
      # the digest sign-attest signed and attested
      - name: 'Resolve the image digest'
        id: image
        shell: bash
        env:
          SIGNED: ${{ needs.sign-attest.outputs.digest }}
        run: |
          # Resolve the image digest
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No manifest digest for ${IMAGE}:${TAG} ❌" >&2
            exit 1
          fi
          if [[ "${digest}" != "${SIGNED}" ]]; then
            echo "::error::${IMAGE}:${TAG} is ${digest}," \
              "but sign-attest signed '${SIGNED}' ❌" >&2
            exit 1
          fi
          echo "Resolved ${IMAGE}:${TAG} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Chart.yaml's version is a placeholder; the chart version tracks
      # the tag, and appVersion stays the Gerrit version
      - name: 'Pin and package the chart'
        id: package
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Pin and package the chart
          set -euo pipefail
          version="${TAG#v}"
          uv run --no-dev python scripts/pin-chart-images.py \
            --values "${CHART_DIR}/values.yaml" \
            --repository "${IMAGE}" --tag "${TAG}" --digest "${DIGEST}"
          mkdir -p dist
          helm package "${CHART_DIR}" --version "${version}" \
            --destination dist
          package="dist/gerrit-${version}.tgz"
          test -s "${package}"
          {
            echo "version=${version}"
            echo "package=${package}"
          } >> "$GITHUB_OUTPUT"

      # Check the archive, not the source tree: what is pushed is what
      # is checked. Rendering turns on every optional workload, so
      # each pod spec the chart can produce is covered. The chart has
      # no default authentication, and helm lint skips a template that
      # fails, so both choose one.
      - name: 'Lint and render the packaged chart'
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          # Lint and render the packaged chart
          set -euo pipefail
          auth=(--set auth.type=DEVELOPMENT_BECOME_ANY_ACCOUNT
            --set auth.allowDevelopmentAccounts=true)
          helm lint "${PACKAGE}" "${auth[@]}"
          rendered="${RUNNER_TEMP}/chart-rendered.yaml"
          helm template gerrit "${PACKAGE}" "${auth[@]}" \
            --set persistence.volumePermissions.enabled=true \
            --set gc.cronJob.enabled=true \
            --set logs.retentionDays=7 \
            --set toolbox.enabled=true > "${rendered}"
          uv run --no-dev python scripts/lib/chart_digests.py \
            --digest "${DIGEST}" "${rendered}"
          want="${IMAGE}@${DIGEST}"
          mapfile -t images < <(sed -nE \
            's/^[[:space:]]*image:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' \
            "${rendered}" | sort -u)
          if [[ "${#images[@]}" -ne 1 || "${images[0]}" != "${want}" ]]; then
            echo "::error::Rendered images are not all ${want} ❌" >&2
            printf '  %s\n' "${images[@]}" >&2
            exit 1
          fi
          echo "Every rendered image is ${want} ✅"

      - name: 'Push the chart'
        id: push
        shell: bash
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # Push the chart
          set -euo pipefail
          if ! out=$(helm push "${PACKAGE}" "oci://${CHART_REPO}" 2>&1); then
            echo "${out}" >&2
            echo "::error::helm push of ${PACKAGE} failed ❌" >&2
            exit 1
          fi
          echo "${out}"
          # One package, so exactly one pushed reference and digest
          want="${CHART_REPO}/gerrit:${VERSION}"
          mapfile -t pushed < <(sed -n 's/^Pushed: //p' <<< "${out}")
          mapfile -t digests < <(sed -n 's/^Digest: //p' <<< "${out}")
          if [[ "${#pushed[@]}" -ne 1 || "${pushed[0]}" != "${want}" ]]; then
            echo "::error::Expected one push of ${want}, got:" \
              "${pushed[*]:-none} ❌" >&2
            exit 1
          fi
          if [[ "${#digests[@]}" -ne 1 \
            || ! "${digests[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No chart digest in the helm push output ❌" >&2
            exit 1
          fi
          echo "Published ${want} (${digests[0]})"
          echo "digest=${digests[0]}" >> "$GITHUB_OUTPUT"

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: 'Sign the chart (keyless OIDC)'
        env:
          CHART_REF: '${{ env.CHART_REPO }}/gerrit@${{ steps.push.outputs.digest }}'
        run: cosign sign --yes "${CHART_REF}"

      - name: 'Attest chart build provenance'
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: '${{ env.CHART_REPO }}/gerrit'
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: 'Upload the chart artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: chart-gerrit
          path: ${{ steps.package.outputs.package }}
          retention-days: 90
          if-no-files-found: error

      - name: 'Chart summary'
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.package.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Chart summary
          set -euo pipefail
          identity="https://github.com/${REPO}/.github/workflows/release.yaml@refs/tags/${TAG}"
          {
            echo "## Helm chart"
            echo ""
            echo "\`oci://${CHART_REPO}/gerrit\` version \`${VERSION}\`" \
              "(\`${CHART_DIGEST}\`), pinned to \`${IMAGE}@${DIGEST}\`."
            echo ""
            echo '```sh'
            echo "helm pull oci://${CHART_REPO}/gerrit --version ${VERSION}"
            echo "cosign verify ${CHART_REPO}/gerrit:${VERSION} \\"
            echo "  --certificate-identity ${identity} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo ""
            echo "> [!NOTE]"
            echo "> GHCR creates the \`charts/gerrit\` package private. Once,"
            echo "> after the first release, set it public in the package"
            echo "> settings so \`helm pull\` works anonymously."
          } >> "$GITHUB_STEP_SUMMARY"

  ### Attach the SBOM, Grype reports and chart to the release ###
  release-attach:
    name: 'Attach Release Assets'
    needs: [tag-validate, grype, sign-attest, publish-chart]
    # Run even when grype, sign-attest or publish-chart fails: the
    # reports explain a failed release. promote-release still waits on
    # all three.
    if: >-
      always() && needs.tag-validate.result == 'success'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: write  # Create the draft release and upload assets
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.tag-validate.outputs.tag }}
      # No checkout, so gh needs the repository named
      REPO: ${{ github.repository }}
      # On the path to promotion every report is required; a run that
      # failed upstream attaches what it has to explain the failure
      REQUIRE_REPORTS: >-
        ${{ needs.grype.result == 'success'
        && needs.sign-attest.result == 'success'
        && needs.publish-chart.result == 'success' }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # release-drafter normally drafts the release; create a draft
      # when it has not, as the reusable workflow this replaces did
      - name: 'Ensure a draft release exists'
        shell: bash
        run: |
          # Ensure a draft release exists
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" \
            --json isDraft >/dev/null 2>&1; then
            echo "Release ${TAG} exists"
          else
            echo "Creating draft release for ${TAG}"
            pre=()
            [[ "${TAG#v}" == *-* ]] && pre=(--prerelease)
            gh release create "${TAG}" --repo "${REPO}" --draft \
              "${pre[@]}" --verify-tag --title "Release ${TAG}" \
              --notes "Automated release for ${TAG}"
          fi

      - name: 'Download SBOM'
        # Tolerate a missing SBOM only when an upstream job failed
        continue-on-error: ${{ env.REQUIRE_REPORTS != 'true' }}
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: release-assets
          pattern: sbom-*
          merge-multiple: true

      - name: 'Download Grype reports'
        continue-on-error: ${{ env.REQUIRE_REPORTS != 'true' }}
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: release-assets
          pattern: scan-*
          merge-multiple: true

      - name: 'Download the packaged chart'
        continue-on-error: ${{ env.REQUIRE_REPORTS != 'true' }}
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: release-assets
          pattern: chart-*
          merge-multiple: true

      - name: 'Upload the reports and chart to the release'
        shell: bash
        run: |
          # Upload the reports and chart to the release
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${REQUIRE_REPORTS}" == 'true' ]]; then
            missing=0
            for f in sbom-gerrit.spdx.json grype-gerrit.json \
              grype-gerrit.txt grype-gerrit.sarif "gerrit-${TAG#v}.tgz"; do
              if [[ ! -s "release-assets/${f}" ]]; then
                echo "::error::Release asset ${f} is missing ❌" >&2
                missing=1
              fi
            done
            [[ "${missing}" -eq 0 ]] || exit 1
          fi
          mapfile -t assets < <(find release-assets -type f)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::warning::No release assets found to upload"
            exit 0
          fi
          gh release upload "${TAG}" "${assets[@]}" \
            --repo "${REPO}" --clobber

      - name: 'Append verification footer to release notes'
        # Only when signing ran, or the footer's claims would be false
        if: needs.sign-attest.result == 'success'
        shell: bash
        env:
          CHART_PUBLISHED: ${{ needs.publish-chart.result == 'success' }}
        run: |
          # Append verification footer to release notes
          set -euo pipefail
          # The sentinel keeps the footer idempotent across re-runs
          sentinel='<!-- gerrit release verification footer -->'
          existing=$(gh release view "${TAG}" \
            --repo "${REPO}" --json body --jq .body)
          head_body="${existing%%"${sentinel}"*}"

          footer=$(cat <<EOF
          ${sentinel}

          ---

          ## Container image

          \`${IMAGE}:${TAG}\` (linux/amd64) is cosign-signed (keyless,
          GitHub OIDC) and carries SLSA build-provenance and SPDX SBOM
          attestations as OCI referrers.

          \`\`\`sh
          cosign verify "${IMAGE}:${TAG}" \\
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yaml@refs/tags/${TAG}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://${IMAGE}:${TAG}" --repo ${REPO}
          gh attestation verify "oci://${IMAGE}:${TAG}" --repo ${REPO} \\
            --predicate-type https://spdx.dev/Document
          \`\`\`

          The SPDX SBOM and Grype reports are attached to this release.
          EOF
          )

          if [[ "${CHART_PUBLISHED}" == 'true' ]]; then
            chart="ghcr.io/${REPO}/charts/gerrit"
            version="${TAG#v}"
            footer+=$(cat <<EOF


          ## Helm chart

          \`oci://${chart}\` version \`${version}\` pins the image above
          by digest. It is cosign-signed and carries a SLSA
          build-provenance attestation like the image, and the packaged
          \`gerrit-${version}.tgz\` is attached to this release.

          \`\`\`sh
          helm pull "oci://${chart}" --version ${version}
          cosign verify "${chart}:${version}" \\
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yaml@refs/tags/${TAG}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://${chart}:${version}" --repo ${REPO}
          \`\`\`
          EOF
          )
          fi

          printf '%s\n%s\n' "${head_body}" "${footer}" \
            | gh release edit "${TAG}" --repo "${REPO}" --notes-file -

  ### Promote the draft release ###
  promote-release:
    name: 'Promote Draft Release'
    needs:
      - tag-validate
      - publish-ghcr
      - publish-aliases
      - grype
      - sign-attest
      - publish-chart
      - release-attach
    runs-on: 'ubuntu-24.04'
    # The 'latest' badge is shared state too: same queue as
    # publish-aliases, with the newest-tag check inside it
    concurrency:
      group: 'release-shared-state'
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write  # Promote the draft GitHub release
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          allow_list_summary: 'false'

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A re-run after a successful promotion is a no-op, not an error
      - name: 'Check the release state'
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Check the release state
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "::error::TAG is empty; refusing to promote ❌" >&2
            exit 1
          fi
          is_draft=$(gh release view "${TAG}" --repo "${REPO}" \
            --json isDraft --jq .isDraft)
          case "${TAG#v}" in
            *-*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac
          # Only the newest final tag claims the 'latest' badge, read
          # inside the shared queue so an older tag's run cannot take
          # it back
          latest=false
          if [[ "${is_prerelease}" == false ]]; then
            refs=$(gh api --paginate \
              "repos/${REPO}/git/matching-refs/tags/v" \
              --jq '.[].ref | ltrimstr("refs/tags/")')
            newest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "${refs}" \
              | sort -V | tail -n 1)
            if [[ "${newest}" == "${TAG}" ]]; then
              latest=true
            else
              echo "::warning::${newest} is newer; ${TAG} is not latest"
            fi
          fi
          {
            echo "is_draft=${is_draft}"
            echo "is_prerelease=${is_prerelease}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${TAG}: draft=${is_draft}" \
            "pre-release=${is_prerelease} latest=${latest}"

      # A draft from release-drafter lacks the pre-release flag, and
      # the promote action sets only draft and latest
      - name: 'Set the pre-release flag'
        if: steps.state.outputs.is_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.state.outputs.is_prerelease }}
        run: |
          # Set the pre-release flag
          set -euo pipefail
          gh release edit "${TAG}" --repo "${REPO}" \
            --prerelease="${IS_PRERELEASE}"

      - name: 'Promote draft release'
        if: steps.state.outputs.is_draft == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/draft-release-promote-action@358264a2efca5ac359a90718373cbce18016bd27  # v0.1.7
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ needs.tag-validate.outputs.tag }}"
          latest: "${{ steps.state.outputs.latest }}"

  ### Final summary ###
  summary:
    name: 'Release Summary'
    needs:
      - tag-validate
      - build
      - smoke
      - sbom
      - grype
      - publish-ghcr
      - publish-aliases
      - sign-attest
      - publish-chart
      - release-attach
      - promote-release
    runs-on: 'ubuntu-latest'
    if: always()
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Build summary'
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
          CHART_REPO: 'ghcr.io/${{ github.repository }}/charts'
          R_TAG: ${{ needs.tag-validate.result }}
          R_BUILD: ${{ needs.build.result }}
          R_SMOKE: ${{ needs.smoke.result }}
          R_SBOM: ${{ needs.sbom.result }}
          R_GRYPE: ${{ needs.grype.result }}
          R_PUBLISH: ${{ needs.publish-ghcr.result }}
          R_ALIASES: ${{ needs.publish-aliases.result }}
          R_SIGN: ${{ needs.sign-attest.result }}
          R_CHART: ${{ needs.publish-chart.result }}
          R_ATTACH: ${{ needs.release-attach.result }}
          R_PROMOTE: ${{ needs.promote-release.result }}
        run: |
          # Build summary
          {
            echo "# Release ${TAG}"
            echo ""
            echo "| Stage | Result |"
            echo "| ----- | ------ |"
            echo "| Tag validation | ${R_TAG} |"
            echo "| Image build | ${R_BUILD} |"
            echo "| Smoke test | ${R_SMOKE} |"
            echo "| SBOM generation | ${R_SBOM} |"
            echo "| Grype audit | ${R_GRYPE} |"
            echo "| GHCR publish | ${R_PUBLISH} |"
            echo "| GHCR aliases | ${R_ALIASES} |"
            echo "| Sign + attest | ${R_SIGN} |"
            echo "| Chart publish | ${R_CHART} |"
            echo "| Release assets | ${R_ATTACH} |"
            echo "| Release promote | ${R_PROMOTE} |"
            echo ""
            if [[ "${R_PROMOTE}" == "success" ]]; then
              echo "## ✅ Release published"
              echo ""
              echo '```sh'
              echo "docker pull ${IMAGE}:${TAG}"
              echo "helm pull oci://${CHART_REPO}/gerrit --version ${TAG#v}"
              echo '```'
            else
              echo "## ❌ Release did not complete"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
