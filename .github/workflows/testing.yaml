---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

env:
  gerrit-version: '3.13.1-ubuntu24'
  plugin-version: 'stable-3.13'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test Basic Functionality ###
  test-basic:
    name: 'Test basic functionality'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Cache Docker layers
      - name: 'Cache Docker layers'
        # yamllint disable-line rule:line-length
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          # yamllint disable-line rule:line-length
          key: gerrit-docker-${{ runner.os }}-${{ env.gerrit-version }}-basic
          restore-keys: |
            gerrit-docker-${{ runner.os }}-${{ env.gerrit-version }}
            gerrit-docker-${{ runner.os }}-
            gerrit-docker-

      # Generate ephemeral SSH key for testing
      - name: 'Generate ephemeral SSH key'
        id: ssh-key
        shell: bash
        run: |
          # Generate ephemeral SSH key for testing
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" \
            -C "test@gerrit-action"
          chmod 600 /tmp/test_key
          echo "SSH key generated for testing"
          # Output the key for use in the action
          {
            echo "TEST_KEY<<EOF"
            cat /tmp/test_key
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Test: Single instance without replication
      - name: "Test: Single instance (no sync)"
        id: basic-test
        uses: $/
        with:
          gerrit_setup: |
            [{
              "slug": "test-basic",
              "gerrit": "gerrit.example.org"
            }]
          ssh_private_key: ${{ steps.ssh-key.outputs.TEST_KEY }}
          gerrit_version: ${{ env.gerrit-version }}
          plugin_version: ${{ env.plugin-version }}
          sync_on_startup: false
          check_service: true
          exit: true
          debug: true
          skip_plugin_install: false
          enable_cache: true
          cache_key_suffix: '-basic'

      # Validate outputs
      - name: 'Validate basic test outputs'
        shell: bash
        run: |
          # Validate basic test outputs
          echo "Testing outputs from basic test..."

          # Check container_ids
          CONTAINER_IDS="${STEPS_BASIC_TEST_OUTPUTS_CONTAINER_IDS}"
          echo "Container IDs: $CONTAINER_IDS"

          if [ -z "$CONTAINER_IDS" ] || [ "$CONTAINER_IDS" = "null" ]; then
            echo "Error: container_ids output is empty ❌"
            exit 1
          fi

          # Validate JSON format
          echo "$CONTAINER_IDS" | jq empty || {
            echo "Error: container_ids is not valid JSON ❌"
            exit 1
          }

          echo "Basic test outputs validated ✅"

        env:
          STEPS_BASIC_TEST_OUTPUTS_CONTAINER_IDS: ${{ steps.basic-test.outputs.container_ids }}

  ### Test Multiple Instances ###
  test-multiple-instances:
    name: 'Test multiple instances'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      # Cache Docker layers
      - name: 'Cache Docker layers'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: gerrit-docker-${{ runner.os }}-${{ env.gerrit-version }}-multi
          restore-keys: |
            gerrit-docker-${{ runner.os }}-${{ env.gerrit-version }}
            gerrit-docker-${{ runner.os }}-

      # Generate ephemeral SSH key for testing
      - name: 'Generate ephemeral SSH key'
        id: ssh-key
        shell: bash
        run: |
          # Generate ephemeral SSH key for testing
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" \
            -C "test@gerrit-action"
          chmod 600 /tmp/test_key
          echo "SSH key generated for testing"
          # Output the key for use in the action
          {
            echo "TEST_KEY<<EOF"
            cat /tmp/test_key
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Test: Multiple instances
      - name: "Test: Multiple instances"
        id: multi-test
        uses: $/
        with:
          gerrit_setup: |
            [
              {
                "project": "TestProject1",
                "slug": "test1",
                "gerrit": "gerrit1.example.org"
              },
              {
                "project": "TestProject2",
                "slug": "test2",
                "gerrit": "gerrit2.example.org"
              }
            ]
          ssh_private_key: ${{ steps.ssh-key.outputs.TEST_KEY }}
          gerrit_version: ${{ env.gerrit-version }}
          base_http_port: 9000
          base_ssh_port: 30000
          sync_on_startup: false
          check_service: true
          exit: true
          skip_plugin_install: true
          enable_cache: true
          cache_key_suffix: '-multi'

      # Validate multiple instances
      - name: 'Validate multiple instances'
        shell: bash
        run: |
          # Validate multiple instances
          INSTANCES="${STEPS_MULTI_TEST_OUTPUTS_INSTANCES}"
          echo "Instances JSON:"
          echo "$INSTANCES" | jq '.'

          # Count instances
          INSTANCE_COUNT=$(echo "$INSTANCES" | jq '. | length')
          echo "Instance count: $INSTANCE_COUNT"

          if [ "$INSTANCE_COUNT" != "2" ]; then
            echo "Error: Expected 2 instances, got $INSTANCE_COUNT ❌"
            exit 1
          fi

          # Verify both slugs exist
          if ! echo "$INSTANCES" | jq -e '.test1' >/dev/null; then
            echo "Error: test1 instance not found ❌"
            exit 1
          fi

          if ! echo "$INSTANCES" | jq -e '.test2' >/dev/null; then
            echo "Error: test2 instance not found ❌"
            exit 1
          fi

          # Verify ports are different
          PORT1=$(echo "$INSTANCES" | jq -r '.test1.http_port')
          PORT2=$(echo "$INSTANCES" | jq -r '.test2.http_port')

          echo "Instance 1 HTTP port: $PORT1"
          echo "Instance 2 HTTP port: $PORT2"

          if [ "$PORT1" = "$PORT2" ]; then
            echo "Error: Ports should be different ❌"
            exit 1
          fi

          echo "Multiple instances validated ✅"

        env:
          STEPS_MULTI_TEST_OUTPUTS_INSTANCES: ${{ steps.multi-test.outputs.instances }}

  ### Test Persistent Container ###
  test-persistent:
    name: 'Test persistent container'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Cache Docker layers
      - name: 'Cache Docker layers'
        # yamllint disable-line rule:line-length
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: gerrit-docker-${{ runner.os }}-${{ env.gerrit-version }}-persist
          restore-keys: |
            gerrit-docker-${{ runner.os }}-${{ env.gerrit-version }}
            gerrit-docker-${{ runner.os }}-

      # Generate ephemeral SSH key for testing
      - name: 'Generate ephemeral SSH key'
        id: ssh-key
        shell: bash
        run: |
          # Generate ephemeral SSH key for testing
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" \
            -C "test@gerrit-action"
          chmod 600 /tmp/test_key
          echo "SSH key generated for testing"
          # Output the key for use in the action
          {
            echo "TEST_KEY<<EOF"
            cat /tmp/test_key
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The action's steps start in the workspace. Plant modules there
      # that its inline Python must not import; each one records its
      # name and exits non-zero.
      - name: 'Plant modules in the workspace'
        shell: bash
        run: |
          # Plant modules in the workspace
          cd "$GITHUB_WORKSPACE"
          mkdir -p pip nacl
          for f in pip/__init__ pip/__main__ nacl/__init__ nacl/public \
            json pathlib sitecustomize; do
            cat > "$f.py" <<'EOF'
          import os, sys
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'planted-ran'), 'a') as fh:
              fh.write(__name__ + '\n')
          sys.exit(97)
          EOF
          done

      # Start persistent container
      - name: "Start persistent Gerrit container"
        id: persistent
        uses: $/
        with:
          gerrit_setup: |
            [{
              "slug": "persistent",
              "gerrit": "gerrit.example.org"
            }]
          ssh_private_key: ${{ steps.ssh-key.outputs.TEST_KEY }}
          gerrit_version: ${{ env.gerrit-version }}
          base_http_port: 8090
          sync_on_startup: false
          check_service: true
          exit: false
          skip_plugin_install: true
          enable_cache: true
          cache_key_suffix: '-persist'

      - name: 'Check no workspace module was imported'
        shell: bash
        run: |
          # Check no workspace module was imported
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo "Error: the action imported workspace modules ❌"
            cat "$RUNNER_TEMP/planted-ran"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          rm -rf pip nacl json.py pathlib.py sitecustomize.py
          echo "No workspace module was imported ✅"

      # Verify container persists
      - name: 'Verify container still running'
        shell: bash
        run: |
          # Verify container still running
          CONTAINER_ID=$(echo \
            "${STEPS_PERSISTENT_OUTPUTS_CONTAINER_IDS}" | \
            jq -r '.[0]')

          echo "Container ID: $CONTAINER_ID"

          if [ -z "$CONTAINER_ID" ]; then
            echo "Error: No container ID ❌"
            exit 1
          fi

          # Check container exists and is running
          if ! docker inspect "$CONTAINER_ID" >/dev/null 2>&1; then
            echo "Error: Container does not exist ❌"
            exit 1
          fi

          STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER_ID")
          echo "Container state: $STATE"

          if [ "$STATE" != "running" ]; then
            echo "Error: Container is not running ❌"
            exit 1
          fi

          # Test HTTP access
          CONTAINER_IP=$(docker inspect -f \
            '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            "$CONTAINER_ID")

          echo "Testing HTTP access at $CONTAINER_IP:8080..."

          if curl -f -s -m 10 \
            "http://$CONTAINER_IP:8080/config/server/version" \
            >/dev/null; then
            echo "Container is accessible ✅"
          else
            echo "Warning: Container not yet ready for HTTP"
          fi

        env:
          STEPS_PERSISTENT_OUTPUTS_CONTAINER_IDS: ${{ steps.persistent.outputs.container_ids }}

      # Access from another step
      - name: 'Access Gerrit from subsequent step'
        shell: bash
        run: |
          # Access Gerrit from subsequent step
          echo "Accessing Gerrit in a new step..."

          INSTANCES="${STEPS_PERSISTENT_OUTPUTS_INSTANCES}"
          IP=$(echo "$INSTANCES" | jq -r '.persistent.ip')

          echo "Gerrit IP: $IP"
          echo "Container is still accessible from new step ✅"

        env:
          STEPS_PERSISTENT_OUTPUTS_INSTANCES: ${{ steps.persistent.outputs.instances }}

      # Manual cleanup
      - name: 'Manual cleanup'
        if: always()
        shell: bash
        run: |
          # Manual cleanup
          CONTAINER_ID=$(echo \
            "${STEPS_PERSISTENT_OUTPUTS_CONTAINER_IDS}" | \
            jq -r '.[0]')

          if [ -n "$CONTAINER_ID" ] && [ "$CONTAINER_ID" != "null" ]; then
            echo "Cleaning up container: $CONTAINER_ID"
            docker kill "$CONTAINER_ID" 2>/dev/null || \
              echo "Container already stopped"
            echo "Cleanup complete ✅"
          fi

        env:
          STEPS_PERSISTENT_OUTPUTS_CONTAINER_IDS: ${{ steps.persistent.outputs.container_ids }}

  ### Test Input Validation ###
  test-validation:
    name: 'Test input validation'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Test: Missing required input
      - name: "Test: Missing gerrit_setup"
        id: missing-setup
        uses: $/
        continue-on-error: true
        with:
          ssh_private_key: "fake-key"
          gerrit_setup: ""

      - name: 'Validate missing setup failure'
        if: steps.missing-setup.outcome == 'success'
        shell: bash
        run: |
          # Validate missing setup failure
          echo "Error: Action should have failed with missing gerrit_setup ❌"
          exit 1

      # Test: Invalid JSON
      - name: "Test: Invalid JSON format"
        id: invalid-json
        uses: $/
        continue-on-error: true
        with:
          gerrit_setup: "not valid json"
          ssh_private_key: "fake-key"

      - name: 'Validate invalid JSON failure'
        if: steps.invalid-json.outcome == 'success'
        shell: bash
        run: |
          # Validate invalid JSON failure
          echo "Error: Action should have failed with invalid JSON ❌"
          exit 1

      # Test: Invalid auth type
      - name: "Test: Invalid auth type"
        id: invalid-auth
        uses: $/
        continue-on-error: true
        with:
          gerrit_setup: '[{"slug": "test", "gerrit": "example.org"}]'
          auth_type: "invalid_type"

      - name: 'Validate invalid auth failure'
        if: steps.invalid-auth.outcome == 'success'
        shell: bash
        run: |
          # Validate invalid auth failure
          echo "Error: Action should have failed with invalid auth_type ❌"
          exit 1

      - name: 'Validation tests completed'
        shell: bash
        run: |
          # Validation tests completed
          echo "All validation tests passed ✅"

  ### Test with Cache Disabled ###
  test-no-cache:
    name: 'Test without caching'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      # Generate ephemeral SSH key for testing
      - name: 'Generate ephemeral SSH key'
        id: ssh-key
        shell: bash
        run: |
          # Generate ephemeral SSH key for testing
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" \
            -C "test@gerrit-action"
          chmod 600 /tmp/test_key
          echo "SSH key generated for testing"
          # Output the key for use in the action
          {
            echo "TEST_KEY<<EOF"
            cat /tmp/test_key
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Test without cache
      - name: "Test: No caching"
        uses: $/
        with:
          gerrit_setup: |
            [{
              "slug": "no-cache",
              "gerrit": "gerrit.example.org"
            }]
          ssh_private_key: ${{ steps.ssh-key.outputs.TEST_KEY }}
          gerrit_version: ${{ env.gerrit-version }}
          sync_on_startup: false
          check_service: true
          exit: true
          skip_plugin_install: true
          enable_cache: false

      - name: 'No-cache test completed'
        shell: bash
        run: |
          # No-cache test completed
          echo "No-cache test completed ✅"

  ### Unit Tests ###
  # The Python suite under tests/ covers the helper scripts that the
  # action runs inside the container. It also carries the guard in
  # tests/test_no_credential_patterns.py, which keeps credential-shaped
  # literals out of the tree; that guard only prevents anything if CI
  # actually runs it.
  #
  # The job pins its own Helm and Python rather than taking whatever
  # the runner image ships: the chart golden tests depend on the Helm
  # version, and the matrix covers the requires-python floor and the
  # newest Python release.
  unit-tests:
    name: 'Unit tests (Python ${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install Helm'
        # yamllint disable-line rule:line-length
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.22.1'

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: 'Run pytest'
        shell: bash
        run: |
          # Run pytest
          uv run --extra test pytest tests/ -q

  ### Site Export Tool on Python 3.8 ###
  # scripts/gerrit-site-export.py runs with whatever python3 an existing
  # Gerrit host provides, so its tests also run under the oldest Python
  # it supports. The project itself needs a newer one, so this leg runs
  # outside the project with only pytest installed.
  site-export-py38:
    name: 'Site export tool (Python 3.8)'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: 'Run the site export tests under Python 3.8'
        shell: bash
        run: |
          # Run the site export tests under Python 3.8
          uv run --no-project --python 3.8 --with pytest==8.3.5 \
            pytest tests/test_site_export.py

  ### Helm Chart Smoke Test ###
  # Lints and renders K8S/charts/gerrit, then installs it on a kind
  # cluster with the chart image built from this checkout (Dockerfile,
  # then Dockerfile.chart with its plugin catalogue) and checks the
  # site with verify-site.py.
  #
  # The install uses values-local-smoke.yaml, which enables the root
  # volume-permissions init container because kind's local-path
  # provisioner ignores fsGroup. The smoke namespace therefore carries
  # no restricted Pod Security label, and the default restricted,
  # fsGroup-only path is not exercised here.
  chart-smoke:
    name: 'Helm chart smoke test'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      CHART: K8S/charts/gerrit
      SMOKE_IMAGE: gerrit-local
      SMOKE_TAG: smoke
      SMOKE_NAMESPACE: gerrit-smoke
      # The chart has no default image tag; lint and render with one
      LINT_TAG: v0.0.0
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install Helm'
        # yamllint disable-line rule:line-length
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.22.1'

      - name: 'Lint the chart'
        shell: bash
        run: |
          # Lint the chart
          set -euo pipefail
          shopt -s nullglob
          # The chart has no default authentication, and helm lint
          # skips a template that fails; choose one so the defaults
          # lint renders every template
          helm lint "$CHART" --set "image.tag=$LINT_TAG" \
            --set auth.type=DEVELOPMENT_BECOME_ANY_ACCOUNT \
            --set auth.allowDevelopmentAccounts=true
          helm lint "$CHART" -f "$CHART/values-local-smoke.yaml"
          examples=("$CHART"/examples/*.yaml)
          if [ "${#examples[@]}" -eq 0 ]; then
            echo "::error::No values files under $CHART/examples ❌"
            exit 1
          fi
          for f in "${examples[@]}"; do
            echo "Linting with $f"
            helm lint "$CHART" -f "$f" --set "image.tag=$LINT_TAG"
          done

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      # Golden tests of the rendered gerrit.config and of secure.config,
      # with the Helm version pinned above; the unit-tests job runs
      # them as well, with the same pinned Helm
      - name: 'Run the chart golden tests'
        shell: bash
        run: |
          # Run the chart golden tests
          set -euo pipefail
          uv run --extra test pytest tests/chart -q

      # scripts/lib/chart_digests.py parses the rendered manifests as
      # YAML and requires every container, init container and ephemeral
      # container image in every pod spec to end in @<digest>
      - name: 'Render the chart and check image digests'
        shell: bash
        run: |
          # Render the chart and check image digests
          set -euo pipefail
          shopt -s nullglob
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          # Fake, well-formed digest; nothing pulls it
          digest="sha256:$(printf 'chart-smoke' | sha256sum | cut -d' ' -f1)"

          check_digest() {
            uv run --no-dev python scripts/lib/chart_digests.py \
              --digest "$digest" "$1"
          }

          for f in "$CHART/values-local-smoke.yaml" "$CHART"/examples/*.yaml; do
            name=$(basename "$f" .yaml)
            echo "Rendering with $f"
            helm template gerrit "$CHART" --namespace "$SMOKE_NAMESPACE" \
              -f "$f" --set "image.tag=$LINT_TAG" > "$out/$name.yaml"
            helm template gerrit "$CHART" --namespace "$SMOKE_NAMESPACE" \
              -f "$f" --set "image.digest=$digest" \
              > "$out/$name-digest.yaml"
            check_digest "$out/$name-digest.yaml"
            # Guard the guard: the undigested render must fail it with
            # a finding (exit 1), not a parse or usage error (exit 2)
            rc=0
            check_digest "$out/$name.yaml" >/dev/null || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::Digest check gave $rc on an undigested render ❌"
              exit 1
            fi
          done
          echo "Every render carries the image digest when it is set ✅"

      # Guards the lint steps against passing silently: a chart copy
      # with a broken template must fail both lint and render
      - name: 'Check a broken template fails lint'
        shell: bash
        run: |
          # Check a broken template fails lint
          set -euo pipefail
          broken="$RUNNER_TEMP/broken-chart"
          rm -rf "$broken"
          cp -R "$CHART" "$broken"
          printf '%s\n' '{{- if .Values.gerrit.host }}' 'kind: Broken' \
            > "$broken/templates/broken.yaml"
          if helm lint "$broken" >/dev/null 2>&1; then
            echo "::error::helm lint passed a broken template ❌"
            exit 1
          fi
          if helm template gerrit "$broken" >/dev/null 2>&1; then
            echo "::error::helm template rendered a broken template ❌"
            exit 1
          fi
          echo "A broken template fails lint and render ✅"

      - name: 'Cache Docker layers'
        # yamllint disable-line rule:line-length
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          # yamllint disable-line rule:line-length
          key: gerrit-docker-${{ runner.os }}-chart-smoke-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            gerrit-docker-${{ runner.os }}-chart-smoke-
            gerrit-docker-${{ runner.os }}-

      # Pulls from Docker Hub count against an account, when the
      # repository has one, rather than the runner's shared anonymous
      # rate limit. Forked pull requests get no secrets, so the login
      # skips and the images pull anonymously.
      - name: 'Check for Docker Hub credentials'
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Check for Docker Hub credentials
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            echo "login=false" >> "$GITHUB_OUTPUT"
            echo "No Docker Hub credentials; pulling anonymously"
          fi

      - name: 'Log in to Docker Hub'
        if: steps.dockerhub.outputs.login == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # setup-oras checks the download against its own checksum list
      - name: 'Install oras'
        # yamllint disable-line rule:line-length
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
        with:
          version: '1.3.1'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Dockerfile.chart copies the plugin catalogue from the build
      # context. With the lock's GHCR mirror present the fetch must
      # make no request to GerritForge; a lock this change bumps has
      # no mirror yet, so the fetch falls back to the lock's URLs.
      - name: 'Fetch the plugin catalogue'
        shell: bash
        run: |
          # Fetch the plugin catalogue
          set -euo pipefail
          log="$RUNNER_TEMP/plugin-catalogue.log"
          bash scripts/fetch-plugin-catalogue.sh build/plugin-catalogue \
            2>&1 | tee "$log"
          src="$(sed -n 's/^Plugin catalogue source: //p' "$log")"
          case "$src" in
            mirror\ *)
              if grep -qi 'gerritforge' "$log"; then
                echo "::error::The fetch reached GerritForge with the mirror present ❌"
                exit 1
              fi
              echo "Fetched from the mirror, with no GerritForge request ✅"
              ;;
            upstream)
              echo "::notice::No mirror for this lock; fetched from GerritForge"
              ;;
            *)
              echo "::error::The fetch log names no catalogue source ❌"
              exit 1
              ;;
          esac

      # Builds what the release workflow publishes: the Dockerfile at
      # its default GERRIT_VERSION, with buildx and the layer cache,
      # then Dockerfile.chart on the docker driver, whose image store
      # holds the base the first build loaded
      - name: 'Build the chart image'
        shell: bash
        run: |
          # Build the chart image
          set -euo pipefail
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t "${SMOKE_IMAGE}-base:${SMOKE_TAG}" \
            --load \
            .
          docker buildx build --builder default \
            -f Dockerfile.chart \
            --build-arg "BASE_IMAGE=${SMOKE_IMAGE}-base:${SMOKE_TAG}" \
            -t "${SMOKE_IMAGE}:${SMOKE_TAG}" \
            --load \
            .
          # Replace the cache so it does not grow without bound
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # A shared runner fails a cluster bootstrap now and then; one
      # more attempt on a clean slate rides that out. Nothing after
      # this retries: an install or verification failure is real.
      - name: 'Create kind cluster'
        id: kind
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: 'chart-smoke'

      - name: 'Remove the failed kind cluster'
        if: steps.kind.outcome == 'failure'
        shell: bash
        run: |
          # Remove the failed kind cluster
          echo "::warning::Creating the kind cluster failed; retrying once"
          kind delete cluster --name chart-smoke || true

      - name: 'Create kind cluster (retry)'
        if: steps.kind.outcome == 'failure'
        # yamllint disable-line rule:line-length
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: 'chart-smoke'

      - name: 'Install the chart'
        shell: bash
        run: |
          # Install the chart
          set -euo pipefail
          kind load docker-image "${SMOKE_IMAGE}:${SMOKE_TAG}" \
            --name chart-smoke
          helm install gerrit "$CHART" \
            --namespace "$SMOKE_NAMESPACE" --create-namespace \
            -f "$CHART/values-local-smoke.yaml" \
            --set "image.repository=${SMOKE_IMAGE}" \
            --set "image.tag=${SMOKE_TAG}" \
            --set "image.digest=" \
            --wait --timeout 15m

      - name: 'Verify the site'
        shell: bash
        run: |
          # Verify the site
          python3 "$CHART/files/scripts/verify-site.py" \
            --namespace "$SMOKE_NAMESPACE" --fullname gerrit \
            --url-prefix /r --auth-type DEVELOPMENT_BECOME_ANY_ACCOUNT

      # The healthcheck plugin is on by default, so the readiness probe
      # already waits on it; this names any check that fails
      - name: 'Verify the health checks'
        shell: bash
        run: |
          # Verify the health checks
          python3 "$CHART/files/scripts/verify-health.py" \
            --namespace "$SMOKE_NAMESPACE" --fullname gerrit --url-prefix /r

      # values-local-smoke.yaml installs a stub patchset-created hook;
      # a change created over REST must reach it
      - name: 'Verify the hooks'
        shell: bash
        run: |
          # Verify the hooks
          python3 "$CHART/files/scripts/verify-hook.py" \
            --namespace "$SMOKE_NAMESPACE" --fullname gerrit --url-prefix /r \
            --hook-log /var/gerrit/logs/smoke-hook.log

      # The error log must reach the container's output as JSON, and
      # the request logs must stay in logs/ on the site volume
      - name: 'Verify the logs'
        shell: bash
        run: |
          # Verify the logs
          python3 "$CHART/files/scripts/verify-logs.py" \
            --namespace "$SMOKE_NAMESPACE" --fullname gerrit

      # Enables the git gc CronJob with a full gc, runs it once on a
      # fixture repository of loose objects and checks it packed them
      - name: 'Run the git gc CronJob'
        shell: bash
        run: |
          # Run the git gc CronJob
          set -euo pipefail
          ns="$SMOKE_NAMESPACE"
          helm upgrade gerrit "$CHART" --namespace "$ns" --reuse-values \
            --set gc.cronJob.enabled=true \
            --set-json 'gc.cronJob.args=["--prune=now"]' \
            --wait --timeout 15m
          repo=/var/gerrit/git/gc-fixture.git
          in_gerrit() {
            kubectl exec -n "$ns" gerrit-0 -c gerrit -- sh -c "$1"
          }
          in_gerrit "set -e
            export GIT_AUTHOR_NAME=smoke GIT_AUTHOR_EMAIL=smoke@example.org
            export GIT_COMMITTER_NAME=smoke GIT_COMMITTER_EMAIL=smoke@example.org
            git init -q --bare $repo
            blob=\$(echo smoke | git --git-dir=$repo hash-object -w --stdin)
            tree=\$(printf '100644 blob %s\tsmoke\n' \$blob \
              | git --git-dir=$repo mktree)
            commit=\$(git --git-dir=$repo commit-tree \$tree -m smoke)
            git --git-dir=$repo update-ref refs/heads/main \$commit"
          loose="find $repo/objects -path '*/[0-9a-f][0-9a-f]/*' -type f"
          before=$(in_gerrit "$loose | wc -l")
          if [ "$before" -eq 0 ]; then
            echo "::error::The fixture repository has no loose objects ❌"
            exit 1
          fi
          kubectl create job -n "$ns" gc-smoke --from=cronjob/gerrit-git-gc
          succeeded=""
          for _ in $(seq 60); do
            succeeded=$(kubectl get job -n "$ns" gc-smoke \
              -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job -n "$ns" gc-smoke \
              -o jsonpath='{.status.failed}')
            if [ "$succeeded" = 1 ] || [ "${failed:-0}" != 0 ]; then
              break
            fi
            sleep 5
          done
          kubectl logs -n "$ns" job/gc-smoke || true
          if [ "$succeeded" != 1 ]; then
            echo "::error::The git gc Job did not succeed ❌"
            exit 1
          fi
          packs=$(in_gerrit "ls $repo/objects/pack/*.pack 2>/dev/null | wc -l")
          after=$(in_gerrit "$loose | wc -l")
          if [ "$packs" -eq 0 ] || [ "$after" -ne 0 ]; then
            echo "::error::gc left $packs packs and $after loose objects ❌"
            exit 1
          fi
          echo "The git gc Job packed $before loose objects ✅"

      # Exports the smoke site with the image's export tool, then
      # replaces the release with one whose site-import init container
      # adopts it: a corrupt archive must fail and a good one recover,
      # the import must verify, a restart must do nothing, and a new
      # forceToken must import once more
      - name: 'Import the site into a new release'
        shell: bash
        run: |
          # Import the site into a new release
          set -euo pipefail
          ns="$SMOKE_NAMESPACE"
          image="${SMOKE_IMAGE}:${SMOKE_TAG}"
          init_log() {
            kubectl logs -n "$ns" gerrit-0 -c site-import
          }
          expect_log() {
            if ! init_log | grep -F -- "$1"; then
              init_log || true
              echo "::error::site-import did not log: $1 ❌"
              exit 1
            fi
          }
          # Deleting waits for the old pod to go, not for the StatefulSet
          # to create its replacement, so wait for a new UID first
          restart() {
            local old new=""
            old=$(kubectl get pod -n "$ns" gerrit-0 -o jsonpath='{.metadata.uid}')
            kubectl delete pod -n "$ns" gerrit-0 --wait
            for _ in $(seq 60); do
              new=$(kubectl get pod -n "$ns" gerrit-0 --ignore-not-found \
                -o jsonpath='{.metadata.uid}')
              if [ -n "$new" ] && [ "$new" != "$old" ]; then
                break
              fi
              sleep 2
            done
            kubectl wait -n "$ns" pod/gerrit-0 --for=condition=Ready \
              --timeout=15m
          }
          # The gc step's upgrade restarted the pod: the fresh install's
          # complete state makes site-import do nothing
          expect_log "mode auto, source none, state complete: nothing"
          server_id=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            git config -f /var/gerrit/etc/gerrit.config gerrit.serverId)
          kubectl scale statefulset -n "$ns" gerrit --replicas=0
          kubectl wait -n "$ns" pod/gerrit-0 --for=delete --timeout=5m
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: gerrit-export
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: site-export
          spec:
            restartPolicy: Never
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              fsGroup: 1001
            containers:
              - name: export
                image: ${image}
                imagePullPolicy: Never
                # A good export, and a copy with a corrupt git.tar.zst
                command:
                  - sh
                  - -ec
                  - >-
                    python3 /opt/gerrit-site-export/gerrit-site-export.py
                    final --pack --i-stopped-writes
                    --site /site --out /export/good;
                    cp -R /export/good /export/corrupt;
                    printf corrupt >> /export/corrupt/git.tar.zst
                volumeMounts:
                  - {name: site, mountPath: /site, readOnly: true}
                  - {name: export, mountPath: /export}
            volumes:
              - name: site
                persistentVolumeClaim: {claimName: site-gerrit-0}
              - name: export
                persistentVolumeClaim: {claimName: gerrit-export}
          EOF
          kubectl wait -n "$ns" pod/site-export \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=10m
          kubectl logs -n "$ns" site-export
          kubectl delete pod -n "$ns" site-export --wait
          helm uninstall gerrit --namespace "$ns" --wait
          kubectl delete pvc -n "$ns" site-gerrit-0 --wait
          helm install gerrit "$CHART" \
            --namespace "$ns" \
            -f "$CHART/values-local-smoke.yaml" \
            --set "image.repository=${SMOKE_IMAGE}" \
            --set "image.tag=${SMOKE_TAG}" \
            --set "image.digest=" \
            --set siteImport.source.type=pvc \
            --set siteImport.source.url=/mnt/import/corrupt \
            --set-json \
              'siteImport.source.volume={"persistentVolumeClaim":{"claimName":"gerrit-export"}}'
          # The corrupt archive must fail site-import and hold Gerrit back.
          # The exit code and the error come from the same pod status
          # record: kubelet may already have dropped that container's log
          terminated='.status.initContainerStatuses[]?
            | select(.name == "site-import")
            | .lastState.terminated // empty'
          last=""
          for _ in $(seq 120); do
            last=$(kubectl get pod -n "$ns" gerrit-0 --ignore-not-found \
              -o json | jq -c "$terminated" || true)
            if [ -n "$last" ]; then
              break
            fi
            sleep 5
          done
          code=$(printf '%s' "${last:-null}" | jq -r '.exitCode // 0')
          message=$(printf '%s' "${last:-null}" | jq -r '.message // ""')
          if [ "$code" = 0 ]; then
            echo "::error::site-import did not fail on a corrupt archive ❌"
            exit 1
          fi
          if ! grep -F "git.tar.zst has sha256" <<< "$message"; then
            printf 'site-import termination message:\n%s\n' "$message"
            kubectl logs -n "$ns" gerrit-0 -c site-import --previous || true
            echo "::error::site-import did not fail on the archive checksum ❌"
            exit 1
          fi
          # A StatefulSet does not replace a pod stuck in its init
          # containers, so the redeploy deletes it
          helm upgrade gerrit "$CHART" --namespace "$ns" --reuse-values \
            --set siteImport.source.url=/mnt/import/good
          restart
          expect_log "mode auto, source pvc, state failed: import"
          expect_log "verified SSH host keys and gerrit.serverId"
          expect_log "import complete"
          imported_id=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            git config -f /var/gerrit/etc/gerrit.config gerrit.serverId)
          if [ "$imported_id" != "$server_id" ]; then
            echo "::error::serverId $imported_id is not $server_id ❌"
            exit 1
          fi
          python3 "$CHART/files/scripts/verify-site.py" \
            --namespace "$ns" --fullname gerrit \
            --url-prefix /r --auth-type DEVELOPMENT_BECOME_ANY_ACCOUNT
          restart
          expect_log "state complete: nothing"
          helm upgrade gerrit "$CHART" --namespace "$ns" --reuse-values \
            --set siteImport.mode=force --set siteImport.forceToken=1 \
            --wait --timeout 15m
          expect_log "mode force, source pvc, state complete: import"
          expect_log "import complete"
          restart
          expect_log "mode force, source pvc, state complete: nothing"
          echo "The site import verified, and ran once per token ✅"

      # Serves the good export over S3 with the chart image's rclone,
      # behind generated keys, then replaces the release with one that
      # imports it through siteImport.source.type s3, with the keys
      # from a Secret and the NetworkPolicy's egress to the endpoint
      - name: 'Import the site from S3'
        shell: bash
        run: |
          # Import the site from S3
          set -euo pipefail
          ns="$SMOKE_NAMESPACE"
          image="${SMOKE_IMAGE}:${SMOKE_TAG}"
          init_log() {
            kubectl logs -n "$ns" gerrit-0 -c site-import
          }
          expect_log() {
            if ! init_log | grep -F -- "$1"; then
              init_log || true
              echo "::error::site-import did not log: $1 ❌"
              exit 1
            fi
          }
          server_id=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            git config -f /var/gerrit/etc/gerrit.config gerrit.serverId)
          helm uninstall gerrit --namespace "$ns" --wait
          kubectl delete pvc -n "$ns" site-gerrit-0 --wait
          kubectl create secret generic -n "$ns" gerrit-export-s3 \
            --from-literal="AWS_ACCESS_KEY_ID=$(openssl rand -hex 10)" \
            --from-literal="AWS_SECRET_ACCESS_KEY=$(openssl rand -hex 20)"
          # rclone serve s3 offers each directory under /data as a
          # bucket: the export volume is the bucket "exports"
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: export-s3
          spec:
            replicas: 1
            selector:
              matchLabels: {app: export-s3}
            template:
              metadata:
                labels: {app: export-s3}
              spec:
                securityContext:
                  runAsUser: 1001
                  runAsGroup: 1001
                  fsGroup: 1001
                containers:
                  - name: rclone
                    image: ${image}
                    imagePullPolicy: Never
                    command: [rclone]
                    args:
                      - serve
                      - s3
                      - --config=/notfound
                      - --addr=:9000
                      - --auth-key=\$(AWS_ACCESS_KEY_ID),\$(AWS_SECRET_ACCESS_KEY)
                      - /data
                    env:
                      - {name: HOME, value: /tmp}
                    envFrom:
                      - secretRef: {name: gerrit-export-s3}
                    ports:
                      - {containerPort: 9000}
                    readinessProbe:
                      tcpSocket: {port: 9000}
                    volumeMounts:
                      - {name: export, mountPath: /data/exports, readOnly: true}
                volumes:
                  - name: export
                    persistentVolumeClaim: {claimName: gerrit-export}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: export-s3
          spec:
            selector: {app: export-s3}
            ports:
              - {port: 9000, targetPort: 9000}
          EOF
          kubectl rollout status -n "$ns" deployment/export-s3 --timeout=5m
          helm install gerrit "$CHART" \
            --namespace "$ns" \
            -f "$CHART/values-local-smoke.yaml" \
            --set "image.repository=${SMOKE_IMAGE}" \
            --set "image.tag=${SMOKE_TAG}" \
            --set "image.digest=" \
            --set siteImport.source.type=s3 \
            --set siteImport.source.url=s3://exports/good \
            --set "siteImport.source.s3.endpoint=http://export-s3.${ns}.svc:9000" \
            --set siteImport.source.s3.provider=Rclone \
            --set siteImport.source.existingSecret=gerrit-export-s3 \
            --wait --timeout 15m
          expect_log "mode auto, source s3"
          expect_log "downloading git.tar.zst from s3://exports/good/git.tar.zst"
          expect_log "verified SSH host keys and gerrit.serverId"
          expect_log "import complete"
          if init_log | grep -F "$(kubectl get secret -n "$ns" gerrit-export-s3 \
            -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"; then
            echo "::error::site-import logged the S3 secret key ❌"
            exit 1
          fi
          imported_id=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            git config -f /var/gerrit/etc/gerrit.config gerrit.serverId)
          if [ "$imported_id" != "$server_id" ]; then
            echo "::error::serverId $imported_id is not $server_id ❌"
            exit 1
          fi
          python3 "$CHART/files/scripts/verify-site.py" \
            --namespace "$ns" --fullname gerrit \
            --url-prefix /r --auth-type DEVELOPMENT_BECOME_ANY_ACCOUNT
          echo "The site imported from S3 and verified ✅"

      # Serves a writable bucket with the chart image's rclone, enables
      # the backup CronJob against it, checks the lock site-init made
      # and that a run skips without it, then runs it three times with a
      # one-hour grace period: the second run must keep the first,
      # which latest named before it. The first two published markers
      # are then backdated by three and two hours, so the third run
      # must prune the first and keep the second, which it replaced.
      # Then replaces the release with one that restores
      # <namespace>/<fullname>/latest, the default prefix, through site
      # import, on whose new site the import must record the site
      # initialised and site-init then create the lock
      - name: 'Back up to S3 and restore the backup'
        shell: bash
        run: |
          # Back up to S3 and restore the backup
          set -euo pipefail
          ns="$SMOKE_NAMESPACE"
          image="${SMOKE_IMAGE}:${SMOKE_TAG}"
          logs="$RUNNER_TEMP/backup-logs"
          mkdir -p "$logs"
          init_log() {
            kubectl logs -n "$ns" gerrit-0 -c site-import
          }
          expect_log() {
            if ! init_log | grep -F -- "$1"; then
              init_log || true
              echo "::error::site-import did not log: $1 ❌"
              exit 1
            fi
          }
          run_backup() {
            local job=$1 succeeded="" failed=""
            kubectl create job -n "$ns" "$job" --from=cronjob/gerrit-backup
            for _ in $(seq 120); do
              succeeded=$(kubectl get job -n "$ns" "$job" \
                -o jsonpath='{.status.succeeded}')
              failed=$(kubectl get job -n "$ns" "$job" \
                -o jsonpath='{.status.failed}')
              if [ "$succeeded" = 1 ] || [ "${failed:-0}" != 0 ]; then
                break
              fi
              sleep 5
            done
            kubectl logs -n "$ns" "job/$job" | tee "$logs/$job.log" || true
            if [ "$succeeded" != 1 ]; then
              echo "::error::The backup Job $job did not succeed ❌"
              exit 1
            fi
          }
          in_store() {
            kubectl exec -n "$ns" deployment/backup-s3 -- sh -c "$1"
          }
          server_id=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            git config -f /var/gerrit/etc/gerrit.config gerrit.serverId)
          # rclone serve s3 offers each directory under /data as a
          # bucket: the emptyDir is the bucket "backups"
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backup-s3
          spec:
            replicas: 1
            selector:
              matchLabels: {app: backup-s3}
            template:
              metadata:
                labels: {app: backup-s3}
              spec:
                securityContext:
                  runAsUser: 1001
                  runAsGroup: 1001
                  fsGroup: 1001
                containers:
                  - name: rclone
                    image: ${image}
                    imagePullPolicy: Never
                    command: [rclone]
                    args:
                      - serve
                      - s3
                      - --config=/notfound
                      - --addr=:9000
                      - --auth-key=\$(AWS_ACCESS_KEY_ID),\$(AWS_SECRET_ACCESS_KEY)
                      - /data
                    env:
                      - {name: HOME, value: /tmp}
                    envFrom:
                      - secretRef: {name: gerrit-export-s3}
                    ports:
                      - {containerPort: 9000}
                    readinessProbe:
                      tcpSocket: {port: 9000}
                    volumeMounts:
                      - {name: backups, mountPath: /data/backups}
                volumes:
                  - name: backups
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backup-s3
          spec:
            selector: {app: backup-s3}
            ports:
              - {port: 9000, targetPort: 9000}
          EOF
          kubectl rollout status -n "$ns" deployment/backup-s3 --timeout=5m
          # Suspended, the CronJob starts no scheduled run, so only
          # run_backup's Jobs write backups however long the step takes
          helm upgrade gerrit "$CHART" --namespace "$ns" --reuse-values \
            --set backup.enabled=true \
            --set backup.suspend=true \
            --set backup.s3.bucket=backups \
            --set "backup.s3.endpoint=http://backup-s3.${ns}.svc:9000" \
            --set backup.s3.provider=Rclone \
            --set backup.existingSecret=gerrit-export-s3 \
            --set backup.retention.keepDaily=1 \
            --set backup.retention.keepWeekly=0 \
            --set backup.retention.minAgeHours=1 \
            --wait --timeout 15m
          # site-init creates the lock the backup takes through its
          # read-only mount; a site without it skips the run. The default
          # prefix is <namespace>/<fullname>
          store="/data/backups/$ns/gerrit"
          lock_dir=/var/gerrit/.chart/backup-lock
          lock_owner=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            stat -c '%u %a' "$lock_dir")
          if [ "$lock_owner" != "1001 700" ]; then
            echo "::error::$lock_dir has owner and mode $lock_owner ❌"
            exit 1
          fi
          kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            mv "$lock_dir" "$lock_dir.off"
          run_backup backup-smoke-skip
          kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            mv "$lock_dir.off" "$lock_dir"
          if ! grep -F "skipping this run: " "$logs/backup-smoke-skip.log" \
            || ! in_store "test ! -e /data/backups/$ns"; then
            echo "::error::A backup without its lock did not skip ❌"
            exit 1
          fi
          run_backup backup-smoke-1
          first=$(in_store "cat $store/latest")
          run_backup backup-smoke-2
          second=$(in_store "cat $store/latest")
          stored=$(in_store "ls $store" | tr '\n' ' ')
          if [ "$first" = "$second" ] \
            || [ "$stored" != "$first $second latest " ]; then
            echo "::error::latest moved from $first to $second; stored: $stored ❌"
            exit 1
          fi
          # Published three and two hours ago: the second replaced the
          # first over minAgeHours ago. The markers keep their length,
          # as rclone serve s3 may cache the sizes it listed
          for backdate in "$first:3" "$second:2"; do
            at=$(date -u -d "${backdate#*:} hours ago" +%Y-%m-%dT%H:%M:%S.%6NZ)
            in_store "printf '{\"publishedAt\": \"%s\"}\n' $at \
              > $store/${backdate%%:*}/published"
          done
          run_backup backup-smoke-3
          third=$(in_store "cat $store/latest")
          stored=$(in_store "ls $store" | tr '\n' ' ')
          if [ "$second" = "$third" ] \
            || [ "$stored" != "$second $third latest " ]; then
            echo "::error::latest moved from $second to $third; stored: $stored ❌"
            exit 1
          fi
          if ! grep -F "deleting s3://backups/$ns/gerrit/$first" \
            "$logs/backup-smoke-3.log"; then
            echo "::error::The third backup did not prune $first ❌"
            exit 1
          fi
          if cat "$logs"/*.log | grep -F "$(kubectl get secret \
            -n "$ns" gerrit-export-s3 \
            -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"; then
            echo "::error::The backup logged the S3 secret key ❌"
            exit 1
          fi
          helm uninstall gerrit --namespace "$ns" --wait
          kubectl delete pvc -n "$ns" site-gerrit-0 --wait
          helm install gerrit "$CHART" \
            --namespace "$ns" \
            -f "$CHART/values-local-smoke.yaml" \
            --set "image.repository=${SMOKE_IMAGE}" \
            --set "image.tag=${SMOKE_TAG}" \
            --set "image.digest=" \
            --set siteImport.source.type=s3 \
            --set "siteImport.source.url=s3://backups/$ns/gerrit/latest" \
            --set "siteImport.source.s3.endpoint=http://backup-s3.${ns}.svc:9000" \
            --set siteImport.source.s3.provider=Rclone \
            --set siteImport.source.existingSecret=gerrit-export-s3 \
            --wait --timeout 15m
          expect_log "s3://backups/$ns/gerrit/latest names the backup s3://backups/$ns/gerrit/$third"
          expect_log "verified SSH host keys and gerrit.serverId"
          expect_log "import complete"
          # On this new site site-import writes .chart/initialised once
          # its init and reindex are done, and site-init, finding it,
          # skips init and creates the lock, the backup's sign that the
          # site is ready, before Gerrit starts
          status=$(kubectl get pod -n "$ns" gerrit-0 -o json)
          epoch() {
            date -u -d "$(jq -r "$1" <<< "$status")" +%s
          }
          imported=$(epoch '.status.initContainerStatuses[]
            | select(.name == "site-import") | .state.terminated.finishedAt')
          gerrit_started=$(epoch '.status.containerStatuses[]
            | select(.name == "gerrit") | .state.running.startedAt')
          lock_made=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            stat -c %Y "$lock_dir")
          marked=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            stat -c %Y /var/gerrit/.chart/initialised)
          if [ "$marked" -gt "$imported" ] || [ "$marked" -gt "$lock_made" ] \
            || kubectl logs -n "$ns" gerrit-0 -c site-init \
              | grep -F "Initialising the Gerrit site"; then
            echo "::error::.chart/initialised at $marked is not site-import's" \
              "or site-init ran init again ❌"
            exit 1
          fi
          if [ "$lock_made" -lt "$imported" ] \
            || [ "$lock_made" -gt "$gerrit_started" ] \
            || ! kubectl logs -n "$ns" gerrit-0 -c site-init | tail -n 1 \
              | grep -F "is ready; backups may run"; then
            echo "::error::$lock_dir appeared at $lock_made, not between" \
              "site-import's end at $imported and Gerrit's start at" \
              "$gerrit_started ❌"
            exit 1
          fi
          restored_id=$(kubectl exec -n "$ns" gerrit-0 -c gerrit -- \
            git config -f /var/gerrit/etc/gerrit.config gerrit.serverId)
          if [ "$restored_id" != "$server_id" ]; then
            echo "::error::serverId $restored_id is not $server_id ❌"
            exit 1
          fi
          python3 "$CHART/files/scripts/verify-site.py" \
            --namespace "$ns" --fullname gerrit \
            --url-prefix /r --auth-type DEVELOPMENT_BECOME_ANY_ACCOUNT
          echo "The backup pruned, restored from latest and verified ✅"

      # Runs on any failure, including one before the cluster exists,
      # so every command tolerates a missing cluster or tool and the
      # upload gets whatever there is
      - name: 'Collect diagnostics'
        if: failure()
        shell: bash
        run: |
          # Collect diagnostics
          out="$RUNNER_TEMP/chart-smoke-diagnostics"
          mkdir -p "$out" || exit 0
          ns="$SMOKE_NAMESPACE"
          docker images > "$out/docker-images.txt" 2>&1 || true
          docker buildx du > "$out/buildx-du.txt" 2>&1 || true
          kind get clusters > "$out/kind-clusters.txt" 2>&1 || true
          helm status gerrit -n "$ns" > "$out/helm-status.txt" 2>&1 || true
          kubectl get all,pvc,configmap,networkpolicy -n "$ns" -o wide \
            > "$out/resources.txt" 2>&1 || true
          kubectl describe all,pvc -n "$ns" > "$out/describe.txt" 2>&1 || true
          kubectl get events -n "$ns" --sort-by=.lastTimestamp \
            > "$out/events.txt" 2>&1 || true
          for pod in $(kubectl get pods -n "$ns" -o name 2>/dev/null || true); do
            name=${pod#pod/}
            kubectl logs -n "$ns" "$pod" --all-containers --prefix \
              > "$out/logs-$name.txt" 2>&1 || true
            kubectl logs -n "$ns" "$pod" --all-containers --prefix \
              --previous > "$out/logs-$name-previous.txt" 2>&1 || true
            # --all-containers reads nothing while an init container
            # holds the pod back, so read each container on its own
            containers=$(kubectl get -n "$ns" "$pod" -o \
              jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}' \
              2>/dev/null || true)
            for c in $containers; do
              kubectl logs -n "$ns" "$pod" -c "$c" \
                > "$out/logs-$name-$c.txt" 2>&1 || true
              kubectl logs -n "$ns" "$pod" -c "$c" --previous \
                > "$out/logs-$name-$c-previous.txt" 2>&1 || true
            done
          done
          kubectl describe nodes > "$out/nodes.txt" 2>&1 || true

      - name: 'Upload diagnostics'
        if: failure()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-smoke-diagnostics
          path: ${{ runner.temp }}/chart-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  ### Release Image Build: Files Changed ###
  # Decides whether release-build runs: only on a pull request that
  # touches what the release build job builds or the egress it runs
  # under.
  release-build-changes:
    name: 'Release build: files changed'
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Check the changed files'
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Check the changed files
          set -euo pipefail
          build=false
          while IFS= read -r path; do
            case "$path" in
              Dockerfile|Dockerfile.chart|docker/*|.github/harden-runner/*|\
              scripts/fetch-plugin-catalogue.sh|scripts/check-plugin-lock.sh|\
              .github/workflows/release.yaml|.grype.yaml)
                echo "Changed: $path"
                build=true
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Release image build needed: $build"

  ### Release Image Build Under Block-Mode Egress ###
  # Builds the release images, Dockerfile and then Dockerfile.chart,
  # with the egress settings of release.yaml's build job, so a build
  # that needs a host the allow-list lacks fails here rather than on a
  # tag. It builds and does not push. Keep these steps in step with
  # the release build job; the only intended difference is that the
  # supplemental allow-list is read at the pull request's head commit,
  # so a change to the list is tested with it.
  #
  # It then repeats release.yaml's SBOM and Grype gate on the image it
  # built, so a base-image or plugin-lock bump that changes a finding
  # fails its own pull request rather than the next release.
  release-build:
    name: 'Release image build (egress blocked)'
    needs: release-build-changes
    if: ${{ needs.release-build-changes.outputs.build == 'true' }}
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
          # yamllint disable-line rule:line-length
          supplemental_config: '${{ github.repository }}//.github/harden-runner/allow_list.txt@${{ github.event.pull_request.head.sha }}'
          supplemental_required: 'true'
          token: ${{ github.token }}

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # As release.yaml's build job logs in to Docker Hub
      - name: 'Check for Docker Hub credentials'
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Check for Docker Hub credentials
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            echo "login=false" >> "$GITHUB_OUTPUT"
            echo "No Docker Hub credentials; pulling anonymously"
          fi

      - name: 'Log in to Docker Hub'
        if: steps.dockerhub.outputs.login == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # setup-oras checks the download against its own checksum list
      - name: 'Install oras'
        # yamllint disable-line rule:line-length
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
        with:
          version: '1.3.1'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: 'Build the image'
        shell: bash
        run: |
          # Build the image
          set -euo pipefail
          docker build -t gerrit-base:build .
          bash scripts/fetch-plugin-catalogue.sh build/plugin-catalogue
          docker build -f Dockerfile.chart \
            --build-arg BASE_IMAGE=gerrit-base:build \
            -t gerrit:release-build .

      # As release.yaml's sbom job generates it
      - name: 'Generate SPDX SBOM'
        # yamllint disable-line rule:line-length
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: 'gerrit:release-build'
          format: spdx-json
          output-file: sbom-gerrit.spdx.json
          upload-artifact: false

      # The same gate as release.yaml's grype job. The action treats a
      # config from a pull request head as untrusted; here .grype.yaml
      # only narrows what fails this pull request's own check, and is
      # reviewed with it. The release gate reads it from the signed tag.
      - name: 'Grype audit SBOM'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@5c81b23afb2ea771b2d247807a12d90783328675  # v0.5.0
        with:
          sbom: 'sbom-gerrit.spdx.json'
          name: 'gerrit'
          config: '.grype.yaml'
          fail-on: 'high'
          only-fixed: 'true'
          bypass-enabled: 'false'
          output-formats: 'json,table'
          output-prefix: 'grype-gerrit'
          summary-title: 'Grype scan'
          upload-artifact: 'false'

      # Repeats release.yaml's 'List accepted findings' step, and warns
      # about each rule that matched nothing so that an accepted
      # finding a bump has fixed, or moved to another version, is
      # removed from .grype.yaml.
      - name: 'List accepted findings'
        if: always()
        shell: bash
        run: |
          # List accepted findings
          set -euo pipefail
          report=grype-gerrit.json
          if [[ ! -f "$report" ]]; then
            echo "::warning::No Grype JSON report to summarise"
            exit 0
          fi
          rows=$(jq -r '.ignoredMatches[]?
            | [.vulnerability.id, .vulnerability.severity,
               .artifact.name, .artifact.version,
               ([.appliedIgnoreRules[]?.reason
                 | select(. != null and . != "")] | join("; ")
                 | if . == "" then "Grype default rule" else . end)]
            | map(tostring | gsub("\\|"; "\\|"))
            | "| " + join(" | ") + " |"' "$report")
          # The rules Grype loaded, less its built-in defaults (which
          # name no vulnerability), that no ignored match applied
          unused=$(jq -r '
            [.ignoredMatches[]?.appliedIgnoreRules[]?
              | [.vulnerability, .package.name, .package.version,
                 .package.type]] as $used
            | .descriptor.configuration.ignore[]?
            | select((.vulnerability // "") != "")
            | [.vulnerability, .package.name, .package.version,
               .package.type] as $rule
            | select([$used[] | select(. == $rule)] | length == 0)
            | "\(.vulnerability) in \(.package.name) \(.package.version)"
            ' "$report")
          {
            echo "## Grype: accepted findings"
            echo ""
            if [[ -z "$rows" ]]; then
              echo "None."
            else
              echo "| Finding | Severity | Package | Version | Reason |"
              echo "| --- | --- | --- | --- | --- |"
              echo "$rows"
            fi
            if [[ -n "$unused" ]]; then
              echo ""
              echo "### .grype.yaml rules that matched nothing"
              echo ""
              while IFS= read -r rule; do
                echo "- ⚠️ ${rule}"
              done <<< "$unused"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$unused" ]]; then
            while IFS= read -r rule; do
              echo "::warning title=Unused Grype ignore rule::${rule}" \
                "matched nothing; remove it from .grype.yaml"
            done <<< "$unused"
          fi

  ### Test Summary ###
  test-summary:
    name: 'Test summary'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - test-basic
      - test-multiple-instances
      - test-persistent
      - test-validation
      - test-no-cache
      - unit-tests
      - site-export-py38
      - chart-smoke
      - release-build-changes
      - release-build
    if: always()
    permissions:
      contents: read
    steps:
      - name: 'Generate test summary'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          # Generate test summary
          {
            echo "# Test Results Summary 🧪"
            echo ""
            echo "| Test | Status |"
            echo "|------|--------|"
            echo "| Basic Functionality | ${NEEDS_TEST_BASIC_RESULT} |"
          # yamllint disable-line rule:line-length
            echo "| Multiple Instances | ${NEEDS_TEST_MULTIPLE_INSTANCES_RESULT} |"  # yamllint disable-line rule:line-length
          # yamllint disable-line rule:line-length
            echo "| Persistent Container | ${NEEDS_TEST_PERSISTENT_RESULT} |"  # yamllint disable-line rule:line-length
            echo "| Input Validation | ${NEEDS_TEST_VALIDATION_RESULT} |"
            echo "| No Cache | ${NEEDS_TEST_NO_CACHE_RESULT} |"
            echo "| Unit Tests | ${NEEDS_UNIT_TESTS_RESULT} |"
            echo "| Site Export (Python 3.8) | ${NEEDS_SITE_EXPORT_PY38_RESULT} |"
            echo "| Helm Chart Smoke | ${NEEDS_CHART_SMOKE_RESULT} |"
            echo "| Release Image Build | ${NEEDS_RELEASE_BUILD_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NEEDS_TEST_BASIC_RESULT: ${{ needs.test-basic.result }}
          NEEDS_TEST_MULTIPLE_INSTANCES_RESULT: ${{ needs.test-multiple-instances.result }}
          NEEDS_TEST_PERSISTENT_RESULT: ${{ needs.test-persistent.result }}
          NEEDS_TEST_VALIDATION_RESULT: ${{ needs.test-validation.result }}
          NEEDS_TEST_NO_CACHE_RESULT: ${{ needs.test-no-cache.result }}
          NEEDS_UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          NEEDS_SITE_EXPORT_PY38_RESULT: ${{ needs.site-export-py38.result }}
          NEEDS_CHART_SMOKE_RESULT: ${{ needs.chart-smoke.result }}
          NEEDS_RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}

      - name: 'Check for failures'
        shell: bash
        run: |
          # Check for failures
          if [ "${NEEDS_TEST_BASIC_RESULT}" != "success" ] || \
             [ "${NEEDS_TEST_MULTIPLE_INSTANCES_RESULT}" != "success" ] || \
             [ "${NEEDS_TEST_PERSISTENT_RESULT}" != "success" ] || \
             [ "${NEEDS_TEST_VALIDATION_RESULT}" != "success" ] || \
             [ "${NEEDS_TEST_NO_CACHE_RESULT}" != "success" ] || \
             [ "${NEEDS_UNIT_TESTS_RESULT}" != "success" ] || \
             [ "${NEEDS_SITE_EXPORT_PY38_RESULT}" != "success" ] || \
             [ "${NEEDS_CHART_SMOKE_RESULT}" != "success" ]; then
            echo "::error::Some tests failed ❌"
            exit 1
          fi

          # The release image build runs only on pull requests that
          # touch what it builds, so skipped passes here
          for result in "${NEEDS_RELEASE_BUILD_CHANGES_RESULT}" \
                        "${NEEDS_RELEASE_BUILD_RESULT}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::The release image build failed ❌"
              exit 1
            fi
          done

          echo "All tests passed! ✅"

        env:
          NEEDS_TEST_BASIC_RESULT: ${{ needs.test-basic.result }}
          NEEDS_TEST_MULTIPLE_INSTANCES_RESULT: ${{ needs.test-multiple-instances.result }}
          NEEDS_TEST_PERSISTENT_RESULT: ${{ needs.test-persistent.result }}
          NEEDS_TEST_VALIDATION_RESULT: ${{ needs.test-validation.result }}
          NEEDS_TEST_NO_CACHE_RESULT: ${{ needs.test-no-cache.result }}
          NEEDS_UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          NEEDS_SITE_EXPORT_PY38_RESULT: ${{ needs.site-export-py38.result }}
          NEEDS_CHART_SMOKE_RESULT: ${{ needs.chart-smoke.result }}
          NEEDS_RELEASE_BUILD_CHANGES_RESULT: ${{ needs.release-build-changes.result }}
          NEEDS_RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
