---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Imports sites that older official Gerrit releases created into the
# chart's release, on kind, and checks nothing went missing.
#
# Each leg builds a synthetic site with gerritcodereview/gerrit:<tag>
# (tests/k8s/build_fixture_site.py), exports it with
# scripts/gerrit-site-export.py, installs the chart with site-import
# reading the export from a claim (tests/k8s/import-leg.sh) and runs
# verify-import.py against the fixture's expected.json. A release older
# than site import supports must instead stop in the site-import init
# container, naming the version floor.
name: 'Site import across releases 🔁'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      source_tags:
        description: >-
          gerritcodereview/gerrit tags to import, separated by spaces or
          commas; a tag older than 3.7.0 must be refused
        required: false
        type: string
        default: ''
  schedule:
    # Mondays, 04:17 UTC
    - cron: '17 4 * * 1'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/site-import-test.yaml'
      - 'K8S/charts/gerrit/files/scripts/site?import*.py'
      - 'K8S/charts/gerrit/files/scripts/verify*.py'
      - 'scripts/gerrit-site-export.py'
      - 'scripts/gerrit_export_git.py'
      - 'tests/k8s/**'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    name: 'Choose the source releases'
    runs-on: 'ubuntu-latest'
    permissions: {}
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: 'audit'

      # The default legs: 3.7.2 (ONAP, OpenDaylight, LF infra, fd.io),
      # 3.8.10 (O-RAN-SC), 3.9.11 (the last index before the 3.10
      # Lucene change), 3.12.11 (the release before the chart's 3.13)
      # and 3.6.8, below the floor, which site-import must refuse
      - name: 'Choose the legs'
        id: legs
        shell: bash
        env:
          SOURCE_TAGS: ${{ inputs.source_tags }}
        run: |
          # Choose the legs
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, re

          default = "3.7.2-ubuntu20 3.8.10-ubuntu22 3.9.11-ubuntu22 " \
              "3.12.11-ubuntu24 3.6.8-ubuntu20"
          tags = re.split(r"[\s,]+", os.environ["SOURCE_TAGS"].strip())
          tags = [t for t in tags if t] or default.split()
          legs = []
          for tag in dict.fromkeys(tags):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(-[a-z0-9]+)?", tag)
              if not match:
                  raise SystemExit(f"::error::Not a release tag: {tag} ❌")
              version = tuple(int(n) for n in match.groups()[:3])
              expect = "import" if version >= (3, 7, 0) else "refuse"
              legs.append({"tag": tag, "expect": expect})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"legs={json.dumps(legs)}\n")
          for leg in legs:
              print(f"{leg['tag']}: {leg['expect']}")
          EOF

  import:
    name: 'Import a ${{ matrix.leg.tag }} site'
    needs: matrix
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.matrix.outputs.legs) }}
    env:
      CHART: K8S/charts/gerrit
      IMAGE: gerrit-local
      TAG: import
      NAMESPACE: gerrit-import
      SOURCE_TAG: ${{ matrix.leg.tag }}
      EXPECT: ${{ matrix.leg.expect }}
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install Helm'
        # yamllint disable-line rule:line-length
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.22.1'

      - name: 'Cache Docker layers'
        # yamllint disable-line rule:line-length
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          # yamllint disable-line rule:line-length
          key: gerrit-docker-${{ runner.os }}-site-import-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            gerrit-docker-${{ runner.os }}-site-import-
            gerrit-docker-${{ runner.os }}-

      # Forked pull requests get no secrets, so the login skips and the
      # images pull anonymously
      - name: 'Check for Docker Hub credentials'
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Check for Docker Hub credentials
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            echo "login=false" >> "$GITHUB_OUTPUT"
            echo "No Docker Hub credentials; pulling anonymously"
          fi

      - name: 'Log in to Docker Hub'
        if: steps.dockerhub.outputs.login == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Before the chart build, so a source release that will not start
      # fails the leg early
      - name: 'Build the fixture site'
        shell: bash
        run: |
          # Build the fixture site
          set -euo pipefail
          python3 tests/k8s/build_fixture_site.py --tag "$SOURCE_TAG" \
            --out "$RUNNER_TEMP/fixture"

      - name: 'Set up Docker Buildx'
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # setup-oras checks the download against its own checksum list
      - name: 'Install oras'
        # yamllint disable-line rule:line-length
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
        with:
          version: '1.3.1'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: 'Fetch the plugin catalogue'
        shell: bash
        run: |
          # Fetch the plugin catalogue
          set -euo pipefail
          bash scripts/fetch-plugin-catalogue.sh build/plugin-catalogue

      # The chart under test, built as the Helm chart smoke test builds
      # it: the Dockerfile, then Dockerfile.chart
      - name: 'Build the chart image'
        shell: bash
        run: |
          # Build the chart image
          set -euo pipefail
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t "${IMAGE}-base:${TAG}" \
            --load \
            .
          docker buildx build --builder default \
            -f Dockerfile.chart \
            --build-arg "BASE_IMAGE=${IMAGE}-base:${TAG}" \
            -t "${IMAGE}:${TAG}" \
            --load \
            .
          # Replace the cache so it does not grow without bound
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # A shared runner fails a cluster bootstrap now and then; one
      # more attempt on a clean slate rides that out. Nothing after
      # this retries: an import or verification failure is real.
      - name: 'Create kind cluster'
        id: kind
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: 'site-import'

      - name: 'Remove the failed kind cluster'
        if: steps.kind.outcome == 'failure'
        shell: bash
        run: |
          # Remove the failed kind cluster
          echo "::warning::Creating the kind cluster failed; retrying once"
          kind delete cluster --name site-import || true

      - name: 'Create kind cluster (retry)'
        if: steps.kind.outcome == 'failure'
        # yamllint disable-line rule:line-length
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: 'site-import'

      - name: 'Import the site'
        shell: bash
        run: |
          # Import the site
          set -euo pipefail
          kind load docker-image "${IMAGE}:${TAG}" --name site-import
          bash tests/k8s/import-leg.sh "$RUNNER_TEMP/fixture" "$EXPECT" \
            "$RUNNER_TEMP/report"

      - name: 'Summarise the leg'
        if: always()
        shell: bash
        run: |
          # Summarise the leg
          report="$RUNNER_TEMP/report/verify-import.json"
          {
            echo "### Site import from Gerrit $SOURCE_TAG ($EXPECT)"
            if [ "$EXPECT" = import ] && [ -s "$report" ]; then
              python3 - "$report" <<'EOF'
          import json, sys

          failures = json.load(open(sys.argv[1]))["failures"]
          for failure in failures:
              print(f"- ❌ {failure}")
          if not failures:
              print("Every invariant held ✅")
          EOF
            elif [ -s "$RUNNER_TEMP/report/site-import.log" ]; then
              echo '```'
              tail -n 20 "$RUNNER_TEMP/report/site-import.log"
              echo '```'
            else
              echo "No report; see the job log ❌"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      # Runs on any outcome, including one before the cluster exists,
      # so every command tolerates a missing cluster or tool. The
      # fixture's password file stays out of the report.
      - name: 'Collect the report'
        if: always()
        shell: bash
        run: |
          # Collect the report
          out="$RUNNER_TEMP/report"
          fixture="$RUNNER_TEMP/fixture"
          ns="$NAMESPACE"
          mkdir -p "$out" || exit 0
          cp "$fixture/expected.json" "$out/" 2>/dev/null || true
          cp "$fixture/export/manifest.json" "$out/" 2>/dev/null || true
          cp "$fixture/gerrit.log" "$out/fixture-gerrit.log" 2>/dev/null || true
          helm status gerrit -n "$ns" > "$out/helm-status.txt" 2>&1 || true
          kubectl get all,pvc -n "$ns" -o wide \
            > "$out/resources.txt" 2>&1 || true
          kubectl describe pods -n "$ns" > "$out/describe.txt" 2>&1 || true
          kubectl get events -n "$ns" --sort-by=.lastTimestamp \
            > "$out/events.txt" 2>&1 || true
          for pod in $(kubectl get pods -n "$ns" -o name 2>/dev/null || true); do
            name=${pod#pod/}
            kubectl logs -n "$ns" "$pod" --all-containers --prefix \
              > "$out/logs-$name.txt" 2>&1 || true
            kubectl logs -n "$ns" "$pod" --all-containers --prefix \
              --previous > "$out/logs-$name-previous.txt" 2>&1 || true
            # --all-containers reads nothing while an init container
            # holds the pod back, so read each container on its own
            containers=$(kubectl get -n "$ns" "$pod" -o \
              jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}' \
              2>/dev/null || true)
            for c in $containers; do
              kubectl logs -n "$ns" "$pod" -c "$c" \
                > "$out/logs-$name-$c.txt" 2>&1 || true
              kubectl logs -n "$ns" "$pod" -c "$c" --previous \
                > "$out/logs-$name-$c-previous.txt" 2>&1 || true
            done
          done

      - name: 'Upload the report'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-import-${{ matrix.leg.tag }}
          path: ${{ runner.temp }}/report
          if-no-files-found: ignore
          retention-days: 14
